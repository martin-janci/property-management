# Docker Compose for Production Deployment
# Usage: docker compose up -d
#
# This configuration provides:
# - Pre-built container images
# - Resource limits for production stability
# - Health checks and restart policies
# - SSL/TLS termination ready (via reverse proxy)

name: ppt

services:
  # ==========================================================================
  # Database Services
  # ==========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: ppt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ppt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-ppt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ppt} -d ${POSTGRES_DB:-ppt}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - ppt-internal

  redis:
    image: redis:7-alpine
    container_name: ppt-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?Redis password required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - ppt-internal

  # ==========================================================================
  # Backend Services
  # ==========================================================================

  api-server:
    image: ${REGISTRY:-ghcr.io/martin-janci}/ppt-api-server:${VERSION:-latest}
    container_name: ppt-api-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ppt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ppt}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP encryption key required (64-char hex, 32 bytes)}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?Integration encryption key required (64-char hex, 32 bytes)}
      RUST_LOG: ${RUST_LOG:-info}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-ppt-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Inbound webhook signing secrets — receiver fails closed when unset;
      # set whichever correspond to the webhooks this environment receives.
      # Integration-connection portal receiver (/api/v1/integrations/webhooks/portal/{connection_id})
      PORTAL_WEBHOOK_SECRET: ${PORTAL_WEBHOOK_SECRET:-}
      AIRBNB_WEBHOOK_SECRET: ${AIRBNB_WEBHOOK_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Per-portal receiver (/api/v1/webhooks/portals/<portal>/...)
      # Each var is <PORTAL>_WEBHOOK_SECRET where portal names are uppercased with hyphens→underscores
      REALITY_PORTAL_WEBHOOK_SECRET: ${REALITY_PORTAL_WEBHOOK_SECRET:-}
      SREALITY_WEBHOOK_SECRET: ${SREALITY_WEBHOOK_SECRET:-}
      BEZREALITKY_WEBHOOK_SECRET: ${BEZREALITKY_WEBHOOK_SECRET:-}
      NEHNUTELNOSTI_WEBHOOK_SECRET: ${NEHNUTELNOSTI_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 128M
          cpus: '0.25'
    networks:
      - ppt-internal
      - ppt-external

  reality-server:
    image: ${REGISTRY:-ghcr.io/martin-janci}/ppt-reality-server:${VERSION:-latest}
    container_name: ppt-reality-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ppt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ppt}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PM_CLIENT_SECRET: ${PM_CLIENT_SECRET:?PM_CLIENT_SECRET required for OAuth client}
      PM_API_URL: ${PM_API_URL:-http://api-server:8080}
      PM_API_HEALTH_URL: ${PM_API_HEALTH_URL:-http://api-server:8080/health}
      RUST_LOG: ${RUST_LOG:-info}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-ppt-images}
      S3_REGION: ${S3_REGION:-us-east-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 128M
          cpus: '0.25'
    networks:
      - ppt-internal
      - ppt-external

  # ==========================================================================
  # Frontend Services
  # ==========================================================================

  ppt-web:
    image: ${REGISTRY:-ghcr.io/martin-janci}/ppt-web:${VERSION:-latest}
    container_name: ppt-web
    restart: unless-stopped
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M
    networks:
      - ppt-external

  reality-web:
    image: ${REGISTRY:-ghcr.io/martin-janci}/ppt-reality-web:${VERSION:-latest}
    container_name: ppt-reality-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    networks:
      - ppt-external

# ==========================================================================
# Networks
# ==========================================================================

networks:
  ppt-internal:
    driver: bridge
    internal: true
  ppt-external:
    driver: bridge

# ==========================================================================
# Volumes
# ==========================================================================

volumes:
  postgres_data:
    name: ppt-postgres-data
  redis_data:
    name: ppt-redis-data
