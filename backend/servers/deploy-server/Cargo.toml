# Standalone crate — deliberately NOT a member of the backend workspace.
# deploy-server is a leaf ops tool and the sole user of sqlx's `sqlite`
# feature; keeping it in the workspace caused feature-unification churn
# between `-p` and `--workspace` builds. The root manifest lists it under
# `exclude`, so all former `workspace = true` inheritances below are spelled
# out explicitly (copied from the root's [workspace.package] /
# [workspace.dependencies] — keep versions in sync manually when bumping).
# See .research/build-experience-report-2026-07-22.md.
[workspace]

[package]
name = "deploy-server"
version = "0.3.218"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "deploy_server"
path = "src/lib.rs"

[[bin]]
name = "ppt-deploy"
path = "src/main.rs"

[[bin]]
name = "pmctl"
path = "src/bin/pmctl.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shellexpand = "3.1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono", "json", "migrate"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
clap = { version = "4.4", features = ["derive", "env"] }
listenfd = "1.0"
bollard = "0.16"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
async-trait = "0.1"
which = "8.0"
dirs = "6.0"
reqwest = { version = "0.13", features = ["json", "form", "query", "http2", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
url = "2"
subtle = "2"

[dev-dependencies]
httpmock = "0.8"
tempfile = "3.10"
axum-test = "21"
