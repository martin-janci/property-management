[package]
name = "api-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# `cargo run -p api-server` broke when the ppt-features/ppt-seed bins were
# added (docker-compose.dev.yml and backend/CLAUDE.md both rely on it).
default-run = "api-server"

[lib]
name = "api_server"
path = "src/lib.rs"

[[bin]]
name = "api-server"
path = "src/main.rs"

[[bin]]
name = "ppt-features"
path = "src/bin/features.rs"

[[bin]]
name = "ppt-seed"
path = "src/bin/seed.rs"

[dependencies]
clap = { workspace = true }
common = { workspace = true }
api-core = { workspace = true }
admin-core = { workspace = true }
db = { workspace = true }
layout-core = { workspace = true }
genpdf = { workspace = true }
rust_xlsxwriter = { workspace = true }
integrations = { workspace = true }
tenant-ops = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }

axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
csv = "1.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
dotenvy = { workspace = true }
dialoguer = { workspace = true }
config = { workspace = true }
anyhow = { workspace = true }
validator = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
thiserror = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
ammonia = "4.0"
totp-rs = { version = "5.6", features = ["gen_secret", "otpauth", "qr"] }
base32 = "0.5"
base64 = "0.22"
aes-gcm = "0.11"
subtle = "2.5"
# Alexa Skills Kit request-signature verification (voice webhook, issue #2668):
# X.509 leaf parsing + RSA-SHA1 (PKCS#1 v1.5) signature check over the raw body.
# `rsa` is already resolved transitively (jsonwebtoken rust_crypto backend); we
# depend on it directly here. `sha1` is pinned to the 0.10 (digest 0.10) line
# so it composes with `rsa` 0.9's `Pkcs1v15Sign::new::<Sha1>()`; the `oid`
# feature supplies the SHA-1 `AssociatedOid` the PKCS#1 v1.5 prefix needs.
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
x509-cert = { version = "0.2", features = ["pem"] }
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "hostname", "smtp-transport"] }
# Bounded-concurrency dispatch for NotificationPipeline (issue #484)
futures-util = "0.3"

# Observability (Epic 95)
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
sentry = { workspace = true }

# Workflow Execution (Epic 94)
async-trait = "0.1"
regex = "1.10"

# Epic 103: Redis Integration (for health check types)
redis = { workspace = true }

# Phase 3: Caddy ask-endpoint rate limiter (process-local Lazy<Mutex<HashMap>>).
once_cell = "1.19"

[dev-dependencies]
# Testing infrastructure (Epic 99)
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
once_cell = "1.19"
urlencoding = { workspace = true }
# WebSocket integration tests (Epic 8A, Story 8A.3)
# The `ws` feature pulls in tokio-tungstenite + related helpers for TestServer::get_websocket.
# `http_transport` mode (required for WS upgrade) binds a real TCP listener per test.
axum-test = { version = "21", features = ["ws"] }
jsonwebtoken = { workspace = true }
