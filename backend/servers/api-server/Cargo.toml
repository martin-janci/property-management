[package]
name = "api-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "api_server"
path = "src/lib.rs"

[[bin]]
name = "api-server"
path = "src/main.rs"

[[bin]]
name = "ppt-features"
path = "src/bin/features.rs"

[[bin]]
name = "ppt-seed"
path = "src/bin/seed.rs"

[dependencies]
clap = { workspace = true }
common = { workspace = true }
api-core = { workspace = true }
db = { workspace = true }
integrations = { workspace = true }
tenant-ops = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }

axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
dotenvy = { workspace = true }
dialoguer = { workspace = true }
config = { workspace = true }
anyhow = { workspace = true }
validator = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
thiserror = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
ammonia = "4.0"
totp-rs = { version = "5.6", features = ["gen_secret", "otpauth"] }
base32 = "0.5"
base64 = "0.22"
aes-gcm = "0.10"
subtle = "2.5"
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "hostname", "smtp-transport"] }

# Observability (Epic 95)
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
sentry = { workspace = true }

# Workflow Execution (Epic 94)
async-trait = "0.1"
regex = "1.10"

# Epic 103: Redis Integration (for health check types)
redis = { workspace = true }

[dev-dependencies]
# Testing infrastructure (Epic 99)
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
once_cell = "1.19"
