[package]
name = "accounting-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "accounting_server"
path = "src/lib.rs"

[[bin]]
name = "accounting-server"
path = "src/main.rs"

[dependencies]
common = { workspace = true }
api-core = { workspace = true }
db = { workspace = true }
accounting-core = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true }
rust_decimal = { workspace = true }
# Invoice PDF rendering (UC-ACC-05.9) — same engine api-server uses (#975.6).
genpdf = { workspace = true }

# Observability (Epic 95) — same stack as reality-server.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
sentry = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
rust_decimal_macros = { workspace = true }
# HTTP handler tests mint api-core JWTs to drive the auth/RLS extractors.
jsonwebtoken = { workspace = true }
