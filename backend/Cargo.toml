[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/api-core",
    "crates/admin-core",
    "crates/db",
    "crates/integrations",
    "crates/tenant-ops",
    "servers/api-server",
    "servers/reality-server",
    "servers/deploy-server",
]

[workspace.package]
version = "0.3.104"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/hanibalsk/property-management"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.12", features = ["typed-header", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono", "decimal"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Validation
validator = { version = "0.20", features = ["derive"] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "rust_decimal"] }
rust_decimal = { version = "1.34", features = ["serde", "serde-str"] }
rust_decimal_macros = "1.34"

# Auth
# jsonwebtoken 10 split its crypto backend into a cargo feature; without one it
# panics at runtime ("Could not determine the CryptoProvider"). `rust_crypto` is
# the pure-Rust backend (matches the provider jsonwebtoken 9 had built in).
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "=0.6.0-rc.8"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
config = "0.15"
dotenvy = "0.15"
rand = "0.10"
hex = "0.4"

# Crypto
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"

# URL encoding
urlencoding = "2.1"
url = "2.5"

# HTTP client (for integrations)
reqwest = { version = "0.13", features = ["json", "form", "query"] }

# XML parsing/generation (for OTA/Booking.com integration)
quick-xml = { version = "0.40", features = ["serialize"] }

# Observability (Epic 95)
opentelemetry = { version = "0.32", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33"
metrics = "0.24"
metrics-exporter-prometheus = "0.12"

# Error tracking (Epic 95)
sentry = { version = "0.48", features = ["tracing", "tower", "tower-http"] }

# AWS SDK for S3 (Epic 103)
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.17"
aws-credential-types = "1.1"

# Redis (Epic 103)
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }

# CLI (Epic 110)
clap = { version = "4.4", features = ["derive", "env"] }
dialoguer = "0.12"

# i18n (Epic 111)
fluent = "0.16"
fluent-bundle = "0.16"
fluent-syntax = "0.11"
unic-langid = "0.9"
intl-memoizer = "0.5"

# Internal crates
common = { path = "crates/common" }
api-core = { path = "crates/api-core" }
admin-core = { path = "crates/admin-core" }
db = { path = "crates/db" }
integrations = { path = "crates/integrations" }
tenant-ops = { path = "crates/tenant-ops" }

# Phase 1: deploy-server
bollard = "0.16"
listenfd = "1.0"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
async-trait = "0.1"
tempfile = "3.10"
which = "8.0"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# `cargo test --workspace` statically links one large binary per test file.
# With full debuginfo (the default) these balloon the runner's root disk and
# the CI `test` job intermittently dies mid-link with SIGTERM (exit 143) — see
# the "Free disk space" note in .github/workflows/backend.yml. Dropping
# debuginfo from the test profile shrinks those binaries dramatically and
# removes the disk-pressure flakiness without affecting test behaviour. Stack
# traces still carry function names; only line-level debug info is omitted.
[profile.test]
debug = false
