[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/layout-core",
    "crates/api-core",
    "crates/admin-core",
    "crates/db",
    "crates/integrations",
    "crates/tenant-ops",
    "crates/accounting-core",
    "servers/api-server",
    "servers/reality-server",
    "servers/accounting-server",
]
# deploy-server is a standalone leaf ops tool, excluded from the workspace on
# purpose: it is the sole user of sqlx's `sqlite` feature, and keeping it as a
# member caused feature-unification churn between `-p` and `--workspace` builds
# (every switch recompiled sqlx and its dependents). It builds with its own
# lockfile from backend/servers/deploy-server/. See
# .research/build-experience-report-2026-07-22.md.
exclude = ["servers/deploy-server"]

[workspace.package]
version = "0.3.218"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/hanibalsk/property-management"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.12", features = ["typed-header", "multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono", "decimal"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Validation
validator = { version = "0.21", features = ["derive"] }

# Database
# Entries within each group are kept alphabetically sorted so that Dependabot
# and manual edits land in a deterministic spot (minimizes merge conflicts).
rust_decimal = { version = "1.34", features = ["serde", "serde-str"] }
rust_decimal_macros = "1.34"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "rust_decimal"] }

# Auth
argon2 = "=0.6.0-rc.8"
# jsonwebtoken 10 split its crypto backend into a cargo feature; without one it
# panics at runtime ("Could not determine the CryptoProvider"). `rust_crypto` is
# the pure-Rust backend (matches the provider jsonwebtoken 9 had built in).
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# Utilities
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
config = "0.15"
dotenvy = "0.15"
hex = "0.4"
rand = "0.10"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# Crypto
base64 = "0.23"
# base32 for RFC-6238 TOTP secrets (authenticator-app compatible)
data-encoding = "2"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
# provably-constant-time equality (timing-safe secret compares)
subtle = "2"

# URL encoding
url = "2.5"
urlencoding = "2.1"

# HTTP client (for integrations)
reqwest = { version = "0.13", features = ["json", "form", "query", "http2"] }

# XML parsing/generation (for OTA/Booking.com integration)
# SECURITY PIN — DO NOT bump casually. The inbound OTA parsers rely on quick-xml
# NOT resolving custom DTD entities (XXE / billion-laughs safety). That posture is
# load-bearing and pinned by the entity guards in integrations `ota_xml`
# (`ota_xml::tests` in crates/integrations/src/booking/ota_xml.rs) — a bump that
# changes entity normalization will turn those tests red. See GH #1519/#1591.
#
# Regression note (GH #2033): PR #2011 folded a quick-xml 0.40->0.41 bump into an
# unrelated ammonia RUSTSEC PR, crossing this pin without focused review. To
# prevent a recurrence, changes to this manifest are gated by two markers:
#   1. .github/CODEOWNERS routes every backend/Cargo.toml AND backend/Cargo.lock
#      edit to an explicit owner review.
#   2. backend/deny.toml `[bans]` HARD-bans every quick-xml version other than
#      =0.41.0 (GH #2084). cargo-deny resolves the full graph, so the already-
#      required `cargo-deny` CI job (.github/workflows/backend.yml) fails on any
#      deviation in either the manifest or the lockfile — no PR can cross this
#      pin silently. (This replaced the advisory-only
#      .github/workflows/pinned-dependency-guard.yml, which only annotated.)
# The entity-guard tests are live `#[test]`s in the `integrations` crate (they are
# NOT among the BIT-440-quarantined suites), so `cargo test -p integrations` runs
# them on every bump.
# The requirement is an EXACT pin (`=0.41.0`), not a caret range: `"0.41"` would
# mean `>=0.41.0, <0.42.0`, letting any future `0.41.x` publish (via
# `cargo update` or an in-range Dependabot bump) cross the pin with only a
# Cargo.lock edit. `=0.41.0` forces every move off 0.41.0 to be a manifest edit
# the CODEOWNERS + workflow guards catch. Bump both the `=` requirement here and
# the Cargo.lock entry together in a focused, reviewed PR.
quick-xml = { version = "=0.41.0", features = ["serialize"] }

# Observability (Epic 95)
metrics = "0.24"
metrics-exporter-prometheus = "0.12"
opentelemetry = { version = "0.32", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
tracing-opentelemetry = "0.33"

# Error tracking (Epic 95)
sentry = { version = "0.48", features = ["tracing", "tower", "tower-http"] }

# AWS SDK for S3 (Epic 103)
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-credential-types = "1.1"
aws-sdk-s3 = "1.17"

# Redis (Epic 103)
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }

# CLI (Epic 110)
clap = { version = "4.4", features = ["derive", "env"] }
dialoguer = "0.12"
genpdf = "0.2.0"
rust_xlsxwriter = "0.97"

# i18n (Epic 111)
fluent = "0.16"
fluent-bundle = "0.16"
fluent-syntax = "0.11"
intl-memoizer = "0.5"
unic-langid = "0.9"

# Internal crates
accounting-core = { path = "crates/accounting-core" }
admin-core = { path = "crates/admin-core" }
api-core = { path = "crates/api-core" }
common = { path = "crates/common" }
db = { path = "crates/db" }
integrations = { path = "crates/integrations" }
layout-core = { path = "crates/layout-core" }
tenant-ops = { path = "crates/tenant-ops" }

# Phase 1: deploy-server
async-trait = "0.1"
bollard = "0.16"
futures-util = "0.3"
listenfd = "1.0"
tempfile = "3.10"
tokio-util = { version = "0.7", features = ["io"] }
which = "8.0"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# Dev builds are dominated by agent verify loops (check/clippy/test cycles), so
# we trim debuginfo to cut link time and target-dir size without touching
# opt-level (which would hurt cold-build time). `line-tables-only` keeps file
# and line numbers in backtraces — enough for diagnosing panics — while
# `unpacked` split-debuginfo keeps object debuginfo out of the final link.
# Dependencies get no debuginfo at all: we never step through them.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# `cargo test --workspace` statically links one large binary per test file.
# With full debuginfo (the default) these balloon the runner's root disk and
# the CI `test` job intermittently dies mid-link with SIGTERM (exit 143) — see
# the "Free disk space" note in .github/workflows/backend.yml. Dropping
# debuginfo from the test profile shrinks those binaries dramatically and
# removes the disk-pressure flakiness without affecting test behaviour. Stack
# traces still carry function names; only line-level debug info is omitted.
[profile.test]
debug = false

# ci-trigger
