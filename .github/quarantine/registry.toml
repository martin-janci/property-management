# Quarantine registry — owner + deadline for every `#[ignore]`d Rust test.
#
# Policy: docs/quarantine-policy.md. Enforced by
# .github/workflows/scripts/check-quarantine-age.py (quarantine-age-gate.yml).
#
# Each row grants a quarantined test an OWNER (accountable pm-* role) and a
# DUE date (re-triage-by). When `due` passes, CI fails until the test is
# fixed/un-ignored or re-triaged with a new deadline. Prefer fixing the test
# and DELETING its row over bumping `due`.
#
# `test` key = "<path-relative-to-repo-root>::<test-fn-name>".
# Regenerate the skeleton after releasing/adding quarantines:
#   python3 .github/workflows/scripts/check-quarantine-age.py --census
#
# Rollout 2026-11-21: the 201 tests below were grandfathered in with a
# shared 90-day burn-down deadline (2027-02-19). New quarantines must set
# their own owner + a deadline no more than 90 days out.

