name: 'Docker image tags'
description: >-
  The single shared image-tag contract for every property-management service
  image. Backend and frontend images must never be addressable differently, so
  this is the ONLY place tag patterns are declared. Both docker-build.yml and
  docker-frontend.yml (and their tag-triggered callers) go through here.

# Emitted tag set — see docs "Image tagging contract":
#
#   X.Y.Z            only on a `v*` tag   immutable, the human-readable release tag
#   X.Y              only on a `v*` tag   mutable within a minor
#   latest           only on a `v*` tag   NEVER from a branch push
#   sha-<full sha>   every build          immutable
#   <branch>         branch pushes only   mutable, refused by the deployer
#
# `latest` and `X.Y` are additionally suppressed for pre-release tags
# (`v1.2.3-rc.1`): metadata-action skips `{{major}}.{{minor}}` for pre-releases
# on its own, and the `latest` guard below excludes any tag carrying a `-`, so a
# throwaway or RC tag can never move `latest`.

inputs:
  images:
    description: 'Fully-qualified image name(s), newline-separated.'
    required: true

outputs:
  tags:
    description: 'Newline-separated tag list for docker/build-push-action.'
    value: ${{ steps.meta.outputs.tags }}
  labels:
    description: 'OCI labels for the image.'
    value: ${{ steps.meta.outputs.labels }}
  version:
    description: >-
      The highest-priority tag value: the semver on a `v*` tag, the branch name
      on a branch push. Safe to hand to `imagetools inspect`.
    value: ${{ steps.meta.outputs.version }}
  json:
    description: 'Full metadata-action JSON output.'
    value: ${{ steps.meta.outputs.json }}
  app_version:
    description: >-
      The release version to stamp into the image: the semver of a `v*` tag,
      and the repo-root `VERSION` file on every other ref. Deliberately never
      the branch name (unlike `version` above) — a running container reporting
      `dev` as its version is what made "which version is in prod?"
      unanswerable. Pass this to every Dockerfile as `--build-arg APP_VERSION`.
    value: ${{ steps.appver.outputs.app_version }}
  build_date:
    description: >-
      RFC3339 build timestamp of the BUILT COMMIT (its committer date in UTC),
      not the moment this job happened to run. It must be derived from the
      commit, because this composite action runs once per matrix leg: a
      `date -u` here would stamp a different `org.opencontainers.image.created`
      (and a different runtime `built_at`) into every service image of one
      release, and `created` could then not be used to correlate the services
      of a release. Identical to the `org.opencontainers.image.created` label
      this action sets, so the label, the Dockerfile `LABEL` and the runtime
      `built_at` all carry the same instant for every image of one release.
    value: ${{ steps.appver.outputs.build_date }}

runs:
  using: composite
  steps:
    # Resolved BEFORE metadata-action, because the same value feeds three
    # places that must never disagree: the `org.opencontainers.image.version`
    # label override below, the `--build-arg APP_VERSION` the callers hand to
    # every Dockerfile, and the `/version` endpoint the frontend images serve.
    # metadata-action's own `version` output is the *tag* (branch name on a
    # branch push), which is exactly what must not end up in the label.
    #
    # Needs the repository checked out (for `VERSION`) — both callers check out
    # before invoking this action.
    - name: Resolve app version
      id: appver
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
          # A release tag is the one authoritative version.
          app_version="${GITHUB_REF_NAME#v}"
          origin="git tag ${GITHUB_REF_NAME}"
        else
          # Branch / dispatch build: the repo's single source of truth. Not the
          # branch name.
          app_version="$(tr -d '[:space:]' < VERSION)"
          origin='VERSION file'
        fi
        if [ -z "$app_version" ]; then
          echo "::error::could not resolve an app version (ref=${GITHUB_REF:-unset})"
          exit 1
        fi

        # BUILD DATE = the committer date of the built commit, in UTC.
        #
        # NOT `date -u`: this composite action runs once per matrix leg (three
        # backend images, three frontend images, each also per platform), so a
        # wall-clock timestamp makes every service of one release report a
        # different `org.opencontainers.image.created` / `built_at`. The commit
        # date is the same value in every leg and in both workflows, so the
        # label is a property of the release rather than of the runner.
        commit_sha="${GITHUB_SHA:-HEAD}"
        date_origin="committer date of $commit_sha"
        build_date="$(TZ=UTC git show -s --format=%cd \
          --date=format-local:%Y-%m-%dT%H:%M:%SZ "$commit_sha" 2>/dev/null || true)"
        if [ -z "$build_date" ]; then
          # Only reachable when the checkout has no git metadata. Fall back
          # loudly: the value is still correct-ish, but it is no longer
          # identical across the legs of one release.
          echo "::warning::could not read the committer date of $commit_sha; falling back to the current time, which differs per matrix leg"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          date_origin="wall clock (NOT reproducible across matrix legs)"
        fi

        {
          echo "app_version=$app_version"
          echo "build_date=$build_date"
        } >> "$GITHUB_OUTPUT"
        echo "app_version=$app_version (from $origin)"
        echo "build_date=$build_date ($date_origin)"

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.images }}
        # `latest=false` turns off metadata-action's implicit `latest=auto`,
        # which would re-add `latest` behind our back and defeat the explicit
        # `type=raw` rule below.
        flavor: |
          latest=false
        # Label overrides. metadata-action derives
        # `org.opencontainers.image.version` from its own `version` output, i.e.
        # the branch name on a branch push — the F-P9 blocker. Pin it (and
        # `created`, so it matches the BUILD_DATE build arg byte for byte) to the
        # values resolved above. `revision` (github.sha) and `source` (repo URL)
        # are already correct out of the box.
        labels: |
          org.opencontainers.image.version=${{ steps.appver.outputs.app_version }}
          org.opencontainers.image.created=${{ steps.appver.outputs.build_date }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          type=ref,event=branch
          type=sha,prefix=sha-,format=long
