version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      tokio:
        patterns: ["tokio*"]
      axum:
        patterns: ["axum*", "tower*"]
      serde:
        patterns: ["serde*"]
      sqlx:
        patterns: ["sqlx*"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/mobile-native"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      compose:
        patterns:
          - "androidx.compose*"
          - "androidx.compose.material*"
      ktor:
        patterns:
          - "io.ktor*"
