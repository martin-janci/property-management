version: 2

# Grouping strategy
# -----------------
# - Coordinated dependency families (tokio, axum, ...) update together so
#   their versions never drift apart across a partial merge.
# - Every remaining minor + patch bump is batched into one "safe" PR per
#   ecosystem, to cut review noise for low-risk updates.
# - Major-version bumps deliberately fall OUT of the safe groups and land as
#   individual PRs, so the breaking change is obvious and gets reviewed on
#   its own. (See #350 / #359: majors merged in a batch without the required
#   code changes broke `main`.)
updates:
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      tokio:
        patterns: ["tokio*"]
      axum:
        patterns: ["axum*", "tower*"]
      serde:
        patterns: ["serde*"]
      sqlx:
        patterns: ["sqlx*"]
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # dtolnay/rust-toolchain tags track Rust toolchain releases, so Dependabot
    # keeps proposing a group bump to a nonexistent version (e.g. 1.100.0),
    # which never resolves. All refs are pinned intentionally (9x @1.94.1 plus
    # one @stable in deploy-server.yml); bump them by hand alongside the Rust
    # version. Ignore major/minor auto-bumps here. (See #2466.)
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gradle"
    directory: "/mobile-native"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      compose:
        patterns:
          - "androidx.compose*"
          - "androidx.compose.material*"
      ktor:
        patterns:
          - "io.ktor*"
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
