name: Version Bump

on:
  push:
    branches: [dev]

# Serialize runs so rapid merges to dev don't race each other.
# cancel-in-progress: false means later runs queue instead of being dropped.
concurrency:
  group: version-bump-dev
  cancel-in-progress: false

jobs:
  bump-version:
    name: Bump Patch Version
    runs-on: ubuntu-latest
    # Skip if the commit was made by this workflow (avoid infinite loop)
    if: "!startsWith(github.event.head_commit.message, 'chore(version):')"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # GITHUB_TOKEN push does not re-trigger push-based workflows (GitHub
          # prevents workflow recursion). That is intentional here — the version
          # bump commit does not need to kick off CI again.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Defence-in-depth for finding subagent-race-on-dev-push: a push that
      # touches ONLY .research/** is dispatcher/routine bookkeeping, not a
      # product change, so it must never bump the product version. This caps the
      # "rapid version-bump cycles" from research-state pushes; real feature
      # merges (which touch code) still bump as before.
      - name: Detect .research/-only push
        id: detect
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "no before-sha — bumping"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null) || {
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "diff failed — bumping to be safe"; exit 0; }
          if [ -z "$CHANGED" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "empty diff — bumping to be safe"; exit 0
          fi
          if echo "$CHANGED" | grep -qvE '^\.research/'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "non-.research changes present — bumping"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo ".research/-only push — skipping version bump"
          fi

      - name: Configure git
        if: steps.detect.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node (for package.json sync)
        if: steps.detect.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Recompute the bump against the current tip of dev, then push, retrying
      # on a non-fast-forward rejection. cancel-in-progress: false queues runs
      # rather than dropping them, so by the time a queued run reaches the front
      # of the queue `dev` has advanced — at minimum by the preceding run's own
      # chore(version:) commit — and this run's checkout is stale. A bare push
      # would then be non-fast-forward and the protected-branch hook declines it
      # (GH006). Re-fetching and RECOMPUTING the bump (not replaying a stale
      # commit) against fresh `dev` each attempt keeps the push fast-forward and
      # avoids a double-bump.
      - name: Commit and push version bump
        if: steps.detect.outputs.skip != 'true'
        run: |
          for attempt in 1 2 3; do
            git fetch origin dev
            git reset --hard origin/dev

            ./scripts/bump-version.sh patch

            VERSION=$(cat VERSION | tr -d '[:space:]')
            git add VERSION
            git add backend/Cargo.toml 2>/dev/null || true
            git add frontend/package.json 2>/dev/null || true
            git add "frontend/apps/*/package.json" 2>/dev/null || true
            git add "frontend/packages/*/package.json" 2>/dev/null || true
            git add mobile-native/gradle.properties 2>/dev/null || true
            git add docs/api/typespec/main.tsp 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No version files changed"
              exit 0
            fi

            git commit -m "chore(version): bump to $VERSION"
            if git push origin HEAD:dev; then
              echo "Version bumped to $VERSION and pushed to dev"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — dev moved, retrying"
          done
          echo "ERROR: failed to push version bump after 3 attempts" >&2
          exit 1
