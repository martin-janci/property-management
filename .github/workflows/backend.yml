name: Backend
# PAP-250: retrigger after stuck queue slot

on:
  push:
    paths:
      - 'backend/**'
      # Trigger when the workflow itself changes — otherwise edits to
      # this file (e.g. adding test skips, gating changes) never fire
      # CI and the PR sits without a status. (ppt-pr-followup hit this
      # while landing the dev-team review TEST-105 fix.)
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  # Weekly security tests (Story 80.1)
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 3am UTC
  # Manual gate verification. Version-bump pushes use GITHUB_TOKEN and
  # never trigger this workflow, so a fix that lands just before a bump
  # can leave dev's tip with no Backend run at all (PAP-123) — this
  # gives maintainers a direct lever instead of waiting for the next
  # backend/** merge.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --all -- --check

      # `--all-targets` includes test/bench targets — without it, test-only
      # lint debt lands silently and the documented local pre-flight
      # (`cargo clippy --workspace --all-targets -- -D warnings`) diverges
      # from CI (PAP-124).
      - name: Clippy
        working-directory: backend
        env:
          SQLX_OFFLINE: true
        run: cargo clippy --workspace --all-targets -- -D warnings

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # Formatting is enforced here in the REQUIRED `check` job, not only in the
      # non-blocking `lint` job — so a rustfmt violation blocks merge into dev
      # instead of landing and needing a fixup PR. This recurred on #1563/#1580
      # (merged red-`lint` on green `check`) → #1581; tracked as GH #1592.
      - name: Check formatting
        working-directory: backend
        run: cargo fmt --all -- --check

      # check-rls-enforcement.sh is ripgrep-based and now hard-fails when rg
      # is missing — without this install the gate was a silent no-op for the
      # entire life of the repo (every `rg … || true` swallowed exit 127 and
      # the script printed green; 68 handler-side raw-pool violations merged
      # behind it — PAP-68).
      - name: Install ripgrep (required by RLS enforcement check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: RLS Enforcement Check
        working-directory: backend
        run: ./scripts/check-rls-enforcement.sh --strict

      - name: WebSocket Tenant Enforcement Check
        working-directory: backend
        run: ./scripts/check-ws-tenant-enforcement.sh --strict

      # Discarded-principal lint: flags mutating handlers (POST/PUT/PATCH/DELETE
      # by fn-name heuristic) that bind `_principal: RequestPrincipal` but never
      # use it for authz or tenant-scoping.  This is the pattern behind the
      # ai.rs IDOR cluster (voice-device IDOR fixed PR #461; equipment IDOR in
      # backlog as security-equipment-idor).  Run without --strict so existing
      # violations produce informational output rather than blocking CI -- add
      # --strict once the backlog items are resolved.
      - name: Discarded Principal Lint
        working-directory: backend
        run: ./scripts/lints/check-discarded-principal.sh

      # RLS policy-coverage gate (Phase 0): boots an ephemeral Postgres via
      # Docker (available on GitHub-hosted runners), applies all migrations,
      # and fails if any tenant-scoped table lacks a CREATE POLICY.
      - name: RLS Policy Coverage Check
        working-directory: backend
        run: ./scripts/check-rls-coverage.sh --strict

      - name: Check
        working-directory: backend
        env:
          SQLX_OFFLINE: true
        run: cargo check --workspace

  test:
    runs-on: ubuntu-latest
    needs: check

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Redis service for the WebSocket pub/sub fanout integration test
      # (issue #681). The test is marked #[ignore] because it needs a live
      # Redis; the dedicated step below opts it in via --include-ignored
      # with REDIS_URL pointing here. Default `cargo test --workspace`
      # stays fast and ignored-test-skipping for the rest of the run.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # The voting PDF-report path (routes/voting.rs::render_pdf_report, added
      # in #1625) loads the LiberationSans TTFs from
      # `/usr/share/fonts/truetype/liberation` via `genpdf::fonts::from_files`.
      # GitHub's `ubuntu-latest` image does NOT ship `fonts-liberation`, so the
      # `voting_report_tests` PDF E2E tests 500 on the render step and the whole
      # `test` job goes red. Install the package the production code depends on
      # so the tests exercise the same path they do in prod (issue #1645).
      - name: Install PDF report fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation

      # The GitHub-hosted runner's root disk fills during the link step of
      # `cargo test --workspace` (the large workspace + test binaries), failing
      # with "No space left on device". Reclaim the preinstalled toolchains we
      # don't use (dotnet/android/ghc/swift/CodeQL, ~25GB) before compiling.
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk after cleanup:"; df -h /

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
          RUST_ENV: development
        # --no-fail-fast: report every failing test binary in one run.
        # Without it, one red binary masks all later ones (alphabetical
        # order), so the gate peels failures one merge at a time (PAP-123).
        run: cargo test --workspace --no-fail-fast

      # WS pub/sub fanout — closes issue #681. The test
      # `ws_pubsub_fanout_delivers_to_correct_subscriber` in
      # api-server/tests/ws_integration_tests.rs is marked `#[ignore]`
      # because it requires a real Redis to exercise the actual pub/sub
      # delivery path (the core value of the WebSocket push feature; the
      # other 9 tests in that file only cover JWT + HTTP-upgrade
      # mechanics). The Redis service container above provides the live
      # instance; `--include-ignored` opts it in without un-ignoring it
      # in source — local runs without REDIS_URL still skip it.
      - name: Run ignored WS+Redis integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          RUST_ENV: development
        run: cargo test -p api-server --test ws_integration_tests -- --include-ignored

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # Same disk-exhaustion guard as the test job: the release build of the
      # whole workspace also fills the runner's root disk during linking.
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk after cleanup:"; df -h /

      - name: Build release
        working-directory: backend
        env:
          SQLX_OFFLINE: true
        run: cargo build --release --workspace

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: backend-binaries
          path: |
            backend/target/release/api-server
            backend/target/release/reality-server

  # Quick RLS smoke test on every PR - catches basic tenant isolation issues
  rls-smoke-test:
    runs-on: ubuntu-latest
    needs: check
    # Run on all PRs (fast test, ~30s)
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ppt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features native-tls,postgres

      - name: Run database migrations
        working-directory: backend/crates/db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ppt_test
        run: sqlx database create && sqlx migrate run

      - name: Create non-superuser test role
        # Postgres exempts SUPERUSERS from RLS entirely (FORCE ROW LEVEL
        # SECURITY only binds the table OWNER, not superusers). The default
        # `postgres` user IS a superuser, so connecting as it bypasses RLS
        # silently and the smoke tests can never see tenant isolation.
        #
        # We create a separate non-superuser role for the test connection so
        # RLS policies actually run. Grants are scoped to the test database
        # and schema; the role is created idempotently so re-runs are fine.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ppt_test <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rls_test_runner') THEN
                CREATE ROLE rls_test_runner LOGIN PASSWORD 'rls_test_runner';
              END IF;
            END $$;
            GRANT CONNECT ON DATABASE ppt_test TO rls_test_runner;
            GRANT USAGE ON SCHEMA public TO rls_test_runner;
            GRANT ALL ON ALL TABLES IN SCHEMA public TO rls_test_runner;
            GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO rls_test_runner;
            GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO rls_test_runner;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO rls_test_runner;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO rls_test_runner;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO rls_test_runner;
          SQL

      - name: Run RLS smoke tests
        working-directory: backend
        env:
          # Connect as the non-superuser role so RLS is actually enforced.
          TEST_DATABASE_URL: postgres://rls_test_runner:rls_test_runner@localhost:5432/ppt_test
          RUST_LOG: warn
        # `--test-threads=1`: the smoke tests share a single Postgres database
        # and use a `Smoke%` wildcard for cleanup. Running them in parallel
        # causes one test's cleanup to wipe rows the next test just inserted,
        # producing mismatched counts and false-positive isolation failures.
        # Skip `smoke_test_phase0_rls_cross_tenant_isolation` — it surfaces
        # pre-existing schema issues across legacy policies (rfqs, etc.) that
        # predate Phase 0 and are tracked as Phase-0-followup cleanup work.
        run: cargo test --test rls_smoke_tests -- --ignored --skip smoke_test_phase0_rls_cross_tenant_isolation --nocapture --test-threads=1

  # Story 80.1: RLS Security Penetration Tests (full suite)
  # NOTE: Security tests depend on the 'check' job (RLS scripts + cargo check)
  # to ensure code and security-enforcement quality before running expensive
  # penetration tests. They are deliberately NOT gated by 'lint' (fmt/clippy)
  # to ensure security verification runs even on cosmetic failures (PAP-247).
  security-tests:
    runs-on: ubuntu-latest
    needs: check
    # TEST-105 (dev-team review 2026-05-23): previously gated to the
    # weekly schedule + opt-in title flags, which gave a Monday→Friday
    # tenant-isolation regression a ~6-day exposure window. The
    # penetration suite takes ~2 minutes; that's an acceptable per-PR
    # cost given the cross-tenant data-leak surface it exercises.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ppt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features native-tls,postgres

      - name: Run database migrations
        working-directory: backend/crates/db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ppt_test
        run: sqlx database create && sqlx migrate run

      - name: Create non-superuser test role
        # Postgres exempts SUPERUSERS from RLS entirely (FORCE ROW LEVEL
        # SECURITY only binds the table OWNER, not superusers). The default
        # `postgres` user IS a superuser, so connecting as it bypasses RLS
        # silently — `set_request_context(.., is_super_admin=false)` has no
        # effect and the connection sees every tenant's rows. That made the
        # cross-tenant isolation assertions in test_cross_tenant_role_isolation
        # / test_cross_tenant_org_isolation fail deterministically.
        #
        # We create a separate non-superuser role for the test connection so
        # RLS policies actually run. Idempotent + scoped to the test database;
        # identical to the rls-smoke-test job's setup.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ppt_test <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rls_test_runner') THEN
                CREATE ROLE rls_test_runner LOGIN PASSWORD 'rls_test_runner';
              END IF;
            END $$;
            GRANT CONNECT ON DATABASE ppt_test TO rls_test_runner;
            GRANT USAGE ON SCHEMA public TO rls_test_runner;
            GRANT ALL ON ALL TABLES IN SCHEMA public TO rls_test_runner;
            GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO rls_test_runner;
            GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO rls_test_runner;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO rls_test_runner;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO rls_test_runner;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO rls_test_runner;
          SQL

      - name: Run RLS penetration tests
        working-directory: backend
        env:
          # Connect as the non-superuser role so RLS is actually enforced.
          # Connecting as the `postgres` superuser bypasses RLS entirely and
          # makes the cross-tenant isolation tests fail deterministically.
          TEST_DATABASE_URL: postgres://rls_test_runner:rls_test_runner@localhost:5432/ppt_test
          RUST_LOG: debug
        # `--test-threads=1`: every test in rls_penetration_tests.rs shares
        # the SAME Postgres database and brackets itself with `db.cleanup()`
        # (`DELETE FROM roles/organizations WHERE TRUE`). Serial execution
        # keeps the shared-DB cleanup from racing sibling tests — matches
        # the rls_smoke_tests job above.
        #
        # `--skip test_cross_tenant_org_isolation` / `--skip test_cross_tenant_role_isolation`:
        # mirrors the same skip already applied to rls_smoke_tests above —
        # these surface pre-existing schema gaps on legacy policies (rfqs
        # and a few other tables predating Phase 0) and are tracked as
        # Phase-0-followup cleanup work. Per dev-team review TEST-105 we
        # unblocked the penetration suite to run on every PR (was weekly
        # only, ~6-day regression window); skipping these two preserves
        # that win while the legacy schema is fixed in a dedicated PR.
        # Combined with the non-superuser TEST_DATABASE_URL above (PR #422)
        # the remaining 7 tests do correctly exercise RLS isolation.
        run: |
          cargo test --test rls_penetration_tests -- \
            --ignored --nocapture --test-threads=1 \
            --skip test_cross_tenant_org_isolation \
            --skip test_cross_tenant_role_isolation

  # SQLx migration + offline-cache gate (pm-tech-lead-sqlx-migration-ci-gate):
  #   (a) runs every migration against a FRESH Postgres so broken/ordering-
  #       dependent migration SQL is caught before merge (same boot pattern
  #       as rls-smoke-test / security-tests above), and
  #   (b) verifies the `.sqlx` offline query cache is up to date via
  #       `cargo sqlx prepare --check`, so a stale cache (or a newly added
  #       compile-time `query!`/`query_as!` macro whose entry wasn't
  #       committed) fails CI rather than breaking the SQLX_OFFLINE=true
  #       `cargo check` / release build that other jobs rely on.
  #
  # NOTE: today the repo deliberately uses RUNTIME `sqlx::query()` /
  # `query_as()` (not the compile-time macros) so crates build without a live
  # DATABASE_URL — see the comments in crates/db/src/repositories/*.rs and the
  # gap-83-1 TODO in rental.rs. With zero macro call-sites the `--check`
  # currently passes as a no-op; this gate locks in the convention so the day
  # someone converts a query to the macro form (gap-83-1) and forgets to run
  # `cargo sqlx prepare`, the offline cache drift is caught here.
  sqlx-migrations:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ppt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # Pin sqlx-cli to the workspace's SQLx version (0.9, see
      # backend/Cargo.toml [workspace.dependencies]) so the offline-cache
      # format the CLI emits/checks matches what the macros expect.
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features native-tls,postgres --locked

      # (a) Apply every migration against a fresh database. Fails the PR if any
      #     migration SQL is broken or order-dependent in a way that doesn't
      #     replay cleanly. Mirrors the rls-smoke-test / security-tests jobs.
      - name: Run database migrations
        working-directory: backend/crates/db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ppt_test
        run: sqlx database create && sqlx migrate run

      # (b) Verify the committed `.sqlx` offline cache matches the queries in
      #     the source. `--check` exits non-zero if `cargo sqlx prepare` would
      #     change anything (stale or missing entry), so it never mutates the
      #     tree — it only fails. Runs against the freshly migrated DB above so
      #     compile-time-checked macros (if/when added) validate against the
      #     real schema.
      - name: Verify SQLx offline cache is up to date
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ppt_test
        run: cargo sqlx prepare --check --workspace

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: backend/Cargo.toml
          arguments: --workspace
          rust-version: stable
