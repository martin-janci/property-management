name: Backend
# PAP-250: retrigger after stuck queue slot

# MIXED-PR DETERMINISM (#1672)
# ---------------------------
# `check` and `test` are REQUIRED status-check contexts on `dev` branch
# protection. They must be produced by EXACTLY ONE workflow so the merge gate
# is never resolved by a race between two same-named runs.
#
# Previously this workflow was path-filtered to `backend/**`, and a sibling
# `backend-skip.yml` (path-complement) emitted its own trivially-green `check`
# /`test` jobs for pure-frontend PRs. On a MIXED PR (backend + frontend files)
# BOTH workflows fired and both reported `check`/`test` on the same SHA; which
# run "won" depended on completion order — the ~1s no-op could report green
# while the real backend jobs were still queued, letting a backend change land
# behind a stub (the #1672 spoofed-green race).
#
# The fix: this workflow now ALWAYS runs on `pull_request` (no `paths:` filter),
# so it is the SOLE producer of `check` and `test`. A first `changes` job
# detects whether any backend path changed:
#   - backend touched     -> the real, heavy `check`/`test` steps run.
#   - no backend touched   -> a trivially-green no-op runs INSIDE the same
#                             `check`/`test` job (same context name), satisfying
#                             branch protection for pure-frontend PRs.
# One producer per required context name = no race, on any PR shape.
# `backend-skip.yml` is therefore removed.
#
# BUILD-EXPERIENCE RESTRUCTURE (2026-07-22)
# -----------------------------------------
# Per .research/build-experience-report-2026-07-22.md (Workstream A):
#   - `test-shard`/`test-rest` no longer wait on `check` (de-serialized; the
#     required `test` aggregator still needs + fails on `check`, so
#     required-context semantics are unchanged).
#   - `build` (release build) no longer runs on pull_request — push to
#     dev/main, schedule, and dispatch only.
#   - `lint` merged into `check`: clippy (`--all-targets -D warnings`) replaced
#     `cargo check` as the sole type gate; the standalone
#     backend-fmt-clippy-gate.yml stays as the fast advisory signal.
#   - `deny-ban-presence` deleted — duplicated the required standalone
#     deny-toml-ban-gate.yml workflow verbatim.
#   - sqlx-cli installed via taiki-e/install-action (prebuilt) instead of
#     `cargo install`; rust-cache moved to a shared `backend` lineage saved
#     only from `dev` (release `build` keeps its own lineage — profiles
#     differ); CARGO_INCREMENTAL=0 workflow-wide.

on:
  push:
    # Restrict push-event runs to the integration branches ONLY. Without this,
    # `push` fired on every feature-branch push too, so each PR head SHA carried
    # TWO runs reporting the same required contexts (`check`/`test`): the real
    # pull_request run AND a push run. Because the push run no-op'd those
    # contexts green (the `changes` plumbing bug below), GitHub's "latest wins"
    # resolution among same-named contexts could let the green no-op satisfy the
    # required gate — broken test code merged on a stale/raced no-op (BIT-346).
    # Keying push to dev/main leaves the pull_request run as the sole producer of
    # required contexts on a PR head SHA; push runs now only smoke dev/main tips.
    branches: [dev, main]
    paths:
      - 'backend/**'
      # Trigger when the workflow itself changes — otherwise edits to
      # this file (e.g. adding test skips, gating changes) never fire
      # CI and the PR sits without a status. (ppt-pr-followup hit this
      # while landing the dev-team review TEST-105 fix.)
      - '.github/workflows/backend.yml'
  # NO `paths:` filter on pull_request — this workflow must run on EVERY PR so it
  # is the single deterministic producer of the required `check`/`test` contexts
  # (#1672). The `changes` job below decides whether the heavy steps actually run
  # or a no-op satisfies the gate.
  pull_request:
  # Weekly security tests (Story 80.1)
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 3am UTC
  # Manual gate verification. Version-bump pushes use GITHUB_TOKEN and
  # never trigger this workflow, so a fix that lands just before a bump
  # can leave dev's tip with no Backend run at all (PAP-123) — this
  # gives maintainers a direct lever instead of waiting for the next
  # backend/** merge.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # Incremental compilation only bloats CI caches (per-session artifacts that
  # never get reused across runs) — disable it workflow-wide (2026-07-22).
  CARGO_INCREMENTAL: 0

# A newer push to the PR branch makes an in-flight run obsolete — cancel it so
# the required contexts always reflect the PR's current tip and we don't pay for
# stale full-workspace test runs.
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single source of truth for "did this PR touch the backend?". Every other job
  # keys off `needs.changes.outputs.backend`. On push/schedule/workflow_dispatch
  # there is no PR diff to inspect, so we force backend=true and run the full
  # suite (matches the pre-#1672 behaviour where those events always ran).
  changes:
    runs-on: ubuntu-latest
    # Coalesce BOTH producers: on a PR the `filter` step sets the value and
    # `force` is skipped (empty); on push/schedule/dispatch `filter` is skipped
    # (empty) and `force` sets it. The previous output read ONLY
    # steps.filter.outputs.backend, but the force step had no `id`, so its value
    # never reached the job output — every non-PR event resolved `backend` to ""
    # and the downstream `check`/`test` jobs silently took the NO-OP path and
    # reported green WITHOUT compiling. That is the push-event gate bypass at the
    # heart of BIT-346; the `||` below restores the documented "non-PR events
    # always run the full suite" behaviour.
    outputs:
      backend: ${{ steps.filter.outputs.backend || steps.force.outputs.backend }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect backend changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend.yml'

      # Non-PR events (push to dev/main, weekly schedule, manual dispatch)
      # always exercise the full suite — there is no diff to filter against.
      # The `id` is REQUIRED so the job output above can read this value.
      - name: Force backend=true for non-PR events
        id: force
        if: github.event_name != 'pull_request'
        run: echo "backend=true" >> "$GITHUB_OUTPUT"

  # REQUIRED context `check`. Always runs (so the required status is always
  # produced exactly once — #1672). When no backend paths changed it short-
  # circuits to a no-op; otherwise it runs the real, heavy steps. Every real
  # step is gated on `needs.changes.outputs.backend == 'true'`, and the no-op is
  # gated on its inverse — the JOB itself always runs and reports the `check`
  # context regardless.
  check:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Required check satisfied (no backend paths changed)
        if: needs.changes.outputs.backend != 'true'
        run: |
          echo "Pure-frontend PR — no backend/** changes; backend 'check' job not required to run."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.backend == 'true'

      - name: Install Rust
        if: needs.changes.outputs.backend == 'true'
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        if: needs.changes.outputs.backend == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: "backend"
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true

      # Formatting is enforced here in the REQUIRED `check` job — so a rustfmt
      # violation blocks merge into dev instead of landing and needing a fixup
      # PR. This recurred on #1563/#1580 (merged red-`lint` on green `check`,
      # back when a separate non-blocking `lint` job existed) → #1581; tracked
      # as GH #1592. The `lint` job itself was folded in here 2026-07-22.
      - name: Check formatting
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: cargo fmt --all -- --check

      # Fails the build if two SQLx migrations share a numeric version prefix
      # within the same migrations directory. A collision (e.g. #1688 + #1750
      # both grabbing version 192) makes `sqlx migrate run` die on
      # `_sqlx_migrations_pkey` and breaks `#[sqlx::test]` setups. Pure shell,
      # no toolchain needed, so it runs early.
      - name: Migration Version Collision Check
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: ./scripts/check-migration-versions.sh

      # Regression test for the guard itself (GH #1904): a pure-shell gate with
      # no test can silently rot. This is failing-on-main if the collision
      # detection regresses, so the guard can't quietly stop catching collisions.
      - name: Migration Version Guard Self-Test
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: ./scripts/check-migration-versions.test.sh

      # Orphan-test guard (GH #2158). Fails if any crate ships `.rs` test code in
      # a tests/ SUBDIRECTORY that no top-level test file `mod`-includes — i.e.
      # test code cargo's auto-discovery never compiles (the `tests/integration/`
      # subtree that silently never ran). Pure shell, no toolchain needed, so it
      # runs early alongside the other structural gates.
      - name: Orphan Test Check
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: ./scripts/check-no-orphan-tests.sh

      # Regression test for the orphan-test guard itself (same rationale as the
      # migration-guard self-test above): a pure-shell gate with no test can rot.
      - name: Orphan Test Guard Self-Test
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: ./scripts/check-no-orphan-tests.test.sh

      # check-rls-enforcement.sh is ripgrep-based and now hard-fails when rg
      # is missing — without this install the gate was a silent no-op for the
      # entire life of the repo (every `rg … || true` swallowed exit 127 and
      # the script printed green; 68 handler-side raw-pool violations merged
      # behind it — PAP-68).
      # Same unbounded-apt hazard as the test-shard fonts step (issue #2802):
      # this runs in the REQUIRED `check` context, so a stalled mirror here
      # would wedge the merge gate identically. Bound the network waits + add a
      # step timeout backstop.
      - name: Install ripgrep (required by RLS enforcement check)
        if: needs.changes.outputs.backend == 'true'
        timeout-minutes: 5
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT_OPTS update -qq
          sudo apt-get $APT_OPTS install -y -qq ripgrep

      - name: RLS Enforcement Check
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: ./scripts/check-rls-enforcement.sh --strict

      - name: WebSocket Tenant Enforcement Check
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: ./scripts/check-ws-tenant-enforcement.sh --strict

      # Discarded-principal lint: flags mutating handlers (POST/PUT/PATCH/DELETE
      # by fn-name heuristic) that bind `_principal: RequestPrincipal` but never
      # use it for authz or tenant-scoping.  This is the pattern behind the
      # ai.rs IDOR cluster (voice-device IDOR fixed PR #461; equipment IDOR in
      # backlog as security-equipment-idor).  Run without --strict so existing
      # violations produce informational output rather than blocking CI -- add
      # --strict once the backlog items are resolved.
      - name: Discarded Principal Lint
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: ./scripts/lints/check-discarded-principal.sh

      # RLS policy-coverage gate (Phase 0): boots an ephemeral Postgres via
      # Docker (available on GitHub-hosted runners), applies all migrations,
      # and fails if any tenant-scoped table lacks a CREATE POLICY.
      - name: RLS Policy Coverage Check
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: ./scripts/check-rls-coverage.sh --strict

      # Clippy is the sole type gate (2026-07-22): it fully subsumes
      # `cargo check --workspace` (clippy runs the same type-checking pass),
      # so compiling the workspace twice in two jobs was pure waste.
      # `--all-targets` includes test/bench targets — without it, test-only
      # lint debt lands silently and the documented local pre-flight
      # (`cargo clippy --workspace --all-targets -- -D warnings`) diverges
      # from CI (PAP-124).
      - name: Clippy (type gate)
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        env:
          SQLX_OFFLINE: true
        run: cargo clippy --workspace --all-targets -- -D warnings

  # SHARDED backend tests (issue #2222).
  # ------------------------------------
  # The server crates under `servers/*` own the bulk of the integration test
  # binaries (each statically links its whole server and provisions its own
  # `#[sqlx::test]` DB), so the old single `cargo test --workspace` ran
  # ~107-119 min — right at the `timeout --kill-after=1m 150m` ceiling, wedging
  # EVERY open backend PR on the shared `test` gate.
  #
  # (Correction, issue #2248 finding 1: the specific `-p common --lib` failure
  # PR #2223 unwedged was NOT purely wall-clock. A prior dispatcher commit
  # regenerated the sitemap from 13 -> 19 `ppt-web` routes, so `common`'s
  # `test_metadata` hit a genuine, fast `assertion failed` on a stale hardcoded
  # count; #2223 also bumped that literal. The wall-clock timeout was a real,
  # separate risk that sharding addresses; the one-line count bump was the real
  # `common --lib` fix. `common`'s lib target now derives that expectation from
  # the loaded sitemap so it can't silently rot again — see
  # `backend/crates/common/src/sitemap/mod.rs::test_metadata_stats_match_loaded_collections`.)
  #
  # Nextest archive model (2026-07-22, roadmap item 7 — see
  # .research/build-experience-report-2026-07-22.md). The old model
  # (scripts/ci-test-shard.sh, #2222/#2248) hash-partitioned `crate:test`
  # PAIRS across 4 legs, but every leg still COMPILED its selected binaries
  # from source — the workspace compile+link was paid ~5x (4 shards + rest).
  # Now `test-build` compiles ALL workspace test targets exactly once via
  # `cargo nextest archive` and uploads the zstd archive; the `test-shard`
  # legs download it and only RUN their `--partition hash:m/4` slice —
  # per-TEST partitioning (finer than the old per-binary split), retries and
  # per-test timeouts come from backend/.config/nextest.toml [profile.ci].
  # Doctests are outside nextest's scope and run once in `test-build`, so
  # coverage stays exactly-once with no gap: {shards} ∪ {doctests} = full
  # workspace surface. The old `test-rest` leg is gone — nextest partitions
  # lib/bin/integration tests of ALL crates together.
  # None of these are the required status context (branch protection requires
  # exactly `test`, produced by the thin aggregator below — one producer, per
  # #1672); they skip cleanly on pure-frontend PRs.
  test-build:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Combining many integration-test binaries (each statically links the whole
    # server + deps) spikes peak memory during the parallel link step and the
    # runner OOM-kills the build (SIGTERM/143 with no compile error). Drop
    # test/dev debuginfo — the single biggest contributor to object + link size —
    # and cap concurrent link jobs to keep peak memory under the runner ceiling.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Single `backend-test` lineage (2026-07-22): only this job compiles the
      # test surface now, so there is exactly one writer. Saved only from dev
      # pushes so PR runs don't churn the cache.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: "backend-test"
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true

      # The GitHub-hosted runner's root disk fills during the link step of the
      # api-server test binaries. Reclaim the preinstalled toolchains we don't
      # use (dotnet/android/ghc/swift/CodeQL, ~25GB) before compiling.
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk after cleanup:"; df -h /

      - name: Build test archive (all workspace test binaries, once)
        working-directory: backend
        run: cargo nextest archive --workspace --archive-file nextest-archive.tar.zst

      # Doctests are not supported by nextest; run them here, once, against the
      # warm build cache (#2248 finding 3: doctests must not be silently
      # dropped). No DB service: workspace doctests are compile-level examples
      # (observed 0 executable doctests today) — if one ever needs Postgres it
      # will fail loudly here and this step gets a service.
      - name: Run doctests
        working-directory: backend
        run: cargo test --doc --workspace

      - name: Upload test archive
        uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: backend/nextest-archive.tar.zst
          retention-days: 1

  # Run legs: download the archive and execute one hash partition each. No
  # compilation happens here (no rust-cache either) — wall clock is pure test
  # runtime + service startup. Partition indices are 1-based (nextest).
  test-shard:
    needs: [changes, test-build]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the /4 in the --partition args below.
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Redis service for the WebSocket pub/sub fanout integration test
      # (issue #681). The test is marked #[ignore] because it needs a live
      # Redis; the dedicated step below (shard 0 only) opts it in via
      # --include-ignored with REDIS_URL pointing here.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Checkout is still needed: nextest re-anchors the archived binaries to
      # this source tree via --workspace-remap (fixture files, migration dirs,
      # include_str! paths resolved relative to the workspace).
      - uses: actions/checkout@v7

      # Toolchain pinned for a stable `cargo` shim for `cargo nextest`; no
      # compilation happens in this job.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # The voting PDF-report path (routes/voting.rs::render_pdf_report, added
      # in #1625) loads the LiberationSans TTFs from
      # `/usr/share/fonts/truetype/liberation` via `genpdf::fonts::from_files`.
      # GitHub's `ubuntu-latest` image does NOT ship `fonts-liberation`, so the
      # `voting_report_tests` PDF E2E tests 500 on the render step. Install the
      # package the production code depends on (issue #1645).
      # Bound apt's network waits (issue #2802). Default apt has NO overall
      # timeout: a single stalled/half-open mirror connection blocks
      # `apt-get update` forever. On 2026-08-19 this hung this exact step for
      # ~90 min on random shards (e.g. run 32215620438 shard 1: step ran
      # 04:35:38 → cancelled 06:05:13, so the test steps never started), which
      # cancelled the shard and failed the required `test` roll-up on `dev` and
      # every backend PR. `Acquire::*::Timeout` caps each request, `Retries`
      # rides out transient stalls, and the step-level `timeout-minutes` is a
      # hard backstop so a pathological hang fails fast (minutes) instead of
      # eating the whole 90-minute job budget.
      - name: Install PDF report fonts
        timeout-minutes: 5
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends fonts-liberation

      # The archive extracts the FULL target/debug/deps test-binary set into
      # /tmp — tens of GB. Dependabot PR #2471's shard 3 died with ENOSPC
      # ("error writing file … No space left on device") because this step
      # only existed in test-build after the #2459 restructure. Same reclaim
      # as there: drop the preinstalled toolchains we never use.
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk after cleanup:"; df -h /

      - name: Download test archive
        uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: backend

      # Run this shard's per-test hash partition. Retry/timeout/thread-cap
      # semantics live in backend/.config/nextest.toml [profile.ci]:
      # fail-fast=false (report every failure in one run, PAP-123),
      # test-threads=4 (avoid Postgres pool exhaustion / silent hangs,
      # BIT-334), per-test slow-timeout+terminate (a hung test is killed
      # individually instead of SIGKILLing the whole leg).
      - name: Run tests (partition ${{ matrix.shard }} of 4)
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
          RUST_ENV: development
        run: >
          cargo nextest run --archive-file nextest-archive.tar.zst
          --workspace-remap .
          --profile ci
          --partition 'hash:${{ matrix.shard }}/4'
          || { echo "::error::Backend test partition ${{ matrix.shard }}/4 failed (exit $?)"; exit 1; }

      # WS pub/sub fanout — closes issue #681. `ws_pubsub_fanout_delivers_to_
      # correct_subscriber` (api-server/tests/ws_integration_tests.rs) is
      # `#[ignore]` because it needs a live Redis. Run it once, on partition 1,
      # against the Redis service above (local runs without REDIS_URL still
      # skip it).
      # --test-threads=1: conservative serialization for this small (8-test,
      # ~1 min) step — the tests bind real TCP ports via axum-test's
      # http_transport and share one Redis, so parallelism buys nothing.
      # (The first #2459 red here turned out to be a latent order-dependent
      # test, not a concurrency race: the pubsub test never initialized
      # TestApp's env Once guards and only passed when a sibling in the same
      # process had — fixed in the test itself; single-test repro failed
      # under old-style `cargo test --exact` too.)
      - name: Run ignored WS+Redis integration tests
        if: matrix.shard == 1
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          RUST_ENV: development
        run: >
          cargo nextest run --archive-file nextest-archive.tar.zst
          --workspace-remap .
          --profile ci
          --run-ignored ignored-only
          --test-threads=1
          -E 'binary_id(=api-server::ws_integration_tests)'

  # REQUIRED context `test`. Produced by EXACTLY ONE job (#1672). It is a thin
  # aggregator over `test-build` (archive + doctests) and the `test-shard`
  # partition matrix: `if: always()`-style so the context is emitted on EVERY
  # PR shape (backend, mixed, pure-frontend), and it fails red iff `check`,
  # the archive build, or any partition did not succeed. Keeping the heavy
  # legs in separate (non-required) jobs and gating the single required
  # context here preserves the one-producer-per-required-context invariant
  # while giving the heavy work real parallel headroom.
  test:
    needs: [changes, check, test-build, test-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Required check satisfied (no backend paths changed)
        if: needs.changes.outputs.backend != 'true'
        run: |
          echo "Pure-frontend PR — no backend/** changes; backend 'test' job not required to run."

      - name: Aggregate backend test results
        if: needs.changes.outputs.backend == 'true'
        run: |
          echo "check result:      ${{ needs.check.result }}"
          echo "test-build result: ${{ needs.test-build.result }}"
          echo "test-shard result: ${{ needs.test-shard.result }}"
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "::error::Upstream 'check' job did not succeed (${{ needs.check.result }}); failing required 'test' context."
            exit 1
          fi
          if [ "${{ needs.test-build.result }}" != "success" ]; then
            echo "::error::Test archive build / doctests (test-build) did not succeed (${{ needs.test-build.result }})."
            exit 1
          fi
          if [ "${{ needs.test-shard.result }}" != "success" ]; then
            echo "::error::One or more backend test partitions did not succeed (${{ needs.test-shard.result }})."
            exit 1
          fi
          echo "Archive build, doctests, and all test partitions passed."

  # Not run on pull_request (2026-07-22): a full `--release --workspace` build
  # proves nothing the required `check`/`test` contexts don't already prove on
  # a PR, and it was the single most expensive job on the PR hot path. It still
  # runs on push to dev/main, the weekly schedule, and manual dispatch — the
  # events whose artifacts (backend-binaries) are actually consumed. `build` is
  # not a required context and nothing in this workflow needs it, so skipping
  # it on PRs breaks no DAG edge.
  build:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: github.event_name != 'pull_request' && needs.changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      # Own `backend-release` lineage — release-profile artifacts share nothing
      # with the dev/test-profile lineages and would poison them (2026-07-22).
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: "backend-release"
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true

      # Same disk-exhaustion guard as the test job: the release build of the
      # whole workspace also fills the runner's root disk during linking.
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk after cleanup:"; df -h /

      - name: Build release
        working-directory: backend
        env:
          SQLX_OFFLINE: true
        run: cargo build --release --workspace

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: backend-binaries
          path: |
            backend/target/release/api-server
            backend/target/release/reality-server

  # Quick RLS smoke test on every PR - catches basic tenant isolation issues
  rls-smoke-test:
    runs-on: ubuntu-latest
    needs: [changes, check]
    # Run on backend PRs (fast test, ~30s). Not a required context, so it skips
    # cleanly on pure-frontend PRs (#1672).
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ppt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: "backend"
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true

      # Prebuilt binary via install-action (2026-07-22) — `cargo install
      # sqlx-cli` compiled the CLI from source on every run (~minutes).
      - name: Install SQLx CLI
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run database migrations
        working-directory: backend/crates/db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ppt_test
        run: sqlx database create && sqlx migrate run

      - name: Create non-superuser test role
        # Postgres exempts SUPERUSERS from RLS entirely (FORCE ROW LEVEL
        # SECURITY only binds the table OWNER, not superusers). The default
        # `postgres` user IS a superuser, so connecting as it bypasses RLS
        # silently and the smoke tests can never see tenant isolation.
        #
        # We create a separate non-superuser role for the test connection so
        # RLS policies actually run. Grants are scoped to the test database
        # and schema; the role is created idempotently so re-runs are fine.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ppt_test <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rls_test_runner') THEN
                CREATE ROLE rls_test_runner LOGIN PASSWORD 'rls_test_runner';
              END IF;
            END $$;
            GRANT CONNECT ON DATABASE ppt_test TO rls_test_runner;
            GRANT USAGE ON SCHEMA public TO rls_test_runner;
            GRANT ALL ON ALL TABLES IN SCHEMA public TO rls_test_runner;
            GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO rls_test_runner;
            GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO rls_test_runner;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO rls_test_runner;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO rls_test_runner;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO rls_test_runner;
          SQL

      - name: Run RLS smoke tests
        working-directory: backend
        env:
          # Connect as the non-superuser role so RLS is actually enforced.
          TEST_DATABASE_URL: postgres://rls_test_runner:rls_test_runner@localhost:5432/ppt_test
          RUST_LOG: warn
        # `--test-threads=1`: the smoke tests share a single Postgres database
        # and use a `Smoke%` wildcard for cleanup. Running them in parallel
        # causes one test's cleanup to wipe rows the next test just inserted,
        # producing mismatched counts and false-positive isolation failures.
        # Skip `smoke_test_phase0_rls_cross_tenant_isolation` — it surfaces
        # pre-existing schema issues across legacy policies (rfqs, etc.) that
        # predate Phase 0 and are tracked as Phase-0-followup cleanup work.
        run: cargo test --test rls_smoke_tests -- --ignored --skip smoke_test_phase0_rls_cross_tenant_isolation --nocapture --test-threads=1

  # Story 80.1: RLS Security Penetration Tests (full suite)
  # NOTE: Security tests depend on the 'check' job (RLS enforcement scripts +
  # the type gate) to ensure code and security-enforcement quality before
  # running expensive penetration tests — this `needs: check` edge is
  # deliberate and was kept when the test legs were de-serialized from
  # `check` (2026-07-22). Historically they were NOT gated by the separate
  # 'lint' job (since folded into `check`) so security verification ran even
  # on cosmetic failures (PAP-247).
  security-tests:
    runs-on: ubuntu-latest
    needs: [changes, check]
    # Not a required context; skips cleanly on pure-frontend PRs (#1672). The
    # `changes` job forces backend=true on the weekly schedule / dispatch, so
    # the penetration suite still runs on those events.
    if: needs.changes.outputs.backend == 'true'
    # TEST-105 (dev-team review 2026-05-23): previously gated to the
    # weekly schedule + opt-in title flags, which gave a Monday→Friday
    # tenant-isolation regression a ~6-day exposure window. The
    # penetration suite takes ~2 minutes; that's an acceptable per-PR
    # cost given the cross-tenant data-leak surface it exercises.

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ppt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: "backend"
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true

      # Prebuilt binary via install-action (2026-07-22) — see rls-smoke-test.
      - name: Install SQLx CLI
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run database migrations
        working-directory: backend/crates/db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ppt_test
        run: sqlx database create && sqlx migrate run

      - name: Create non-superuser test role
        # Postgres exempts SUPERUSERS from RLS entirely (FORCE ROW LEVEL
        # SECURITY only binds the table OWNER, not superusers). The default
        # `postgres` user IS a superuser, so connecting as it bypasses RLS
        # silently — `set_request_context(.., is_super_admin=false)` has no
        # effect and the connection sees every tenant's rows. That made the
        # cross-tenant isolation assertions in test_cross_tenant_role_isolation
        # / test_cross_tenant_org_isolation fail deterministically.
        #
        # We create a separate non-superuser role for the test connection so
        # RLS policies actually run. Idempotent + scoped to the test database;
        # identical to the rls-smoke-test job's setup.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ppt_test <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rls_test_runner') THEN
                CREATE ROLE rls_test_runner LOGIN PASSWORD 'rls_test_runner';
              END IF;
            END $$;
            GRANT CONNECT ON DATABASE ppt_test TO rls_test_runner;
            GRANT USAGE ON SCHEMA public TO rls_test_runner;
            GRANT ALL ON ALL TABLES IN SCHEMA public TO rls_test_runner;
            GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO rls_test_runner;
            GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO rls_test_runner;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO rls_test_runner;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO rls_test_runner;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO rls_test_runner;
          SQL

      - name: Run RLS penetration tests
        working-directory: backend
        env:
          # Connect as the non-superuser role so RLS is actually enforced.
          # Connecting as the `postgres` superuser bypasses RLS entirely and
          # makes the cross-tenant isolation tests fail deterministically.
          TEST_DATABASE_URL: postgres://rls_test_runner:rls_test_runner@localhost:5432/ppt_test
          RUST_LOG: debug
        # `--test-threads=1`: every test in rls_penetration_tests.rs shares
        # the SAME Postgres database and brackets itself with `db.cleanup()`
        # (`DELETE FROM roles/organizations WHERE TRUE`). Serial execution
        # keeps the shared-DB cleanup from racing sibling tests — matches
        # the rls_smoke_tests job above.
        #
        # `--skip test_cross_tenant_org_isolation` / `--skip test_cross_tenant_role_isolation`:
        # mirrors the same skip already applied to rls_smoke_tests above —
        # these surface pre-existing schema gaps on legacy policies (rfqs
        # and a few other tables predating Phase 0) and are tracked as
        # Phase-0-followup cleanup work. Per dev-team review TEST-105 we
        # unblocked the penetration suite to run on every PR (was weekly
        # only, ~6-day regression window); skipping these two preserves
        # that win while the legacy schema is fixed in a dedicated PR.
        # Combined with the non-superuser TEST_DATABASE_URL above (PR #422)
        # the remaining 7 tests do correctly exercise RLS isolation.
        run: |
          cargo test --test rls_penetration_tests -- \
            --ignored --nocapture --test-threads=1 \
            --skip test_cross_tenant_org_isolation \
            --skip test_cross_tenant_role_isolation

  # SQLx migration + offline-cache gate (pm-tech-lead-sqlx-migration-ci-gate):
  #   (a) runs every migration against a FRESH Postgres so broken/ordering-
  #       dependent migration SQL is caught before merge (same boot pattern
  #       as rls-smoke-test / security-tests above), and
  #   (b) verifies the `.sqlx` offline query cache is up to date via
  #       `cargo sqlx prepare --check`, so a stale cache (or a newly added
  #       compile-time `query!`/`query_as!` macro whose entry wasn't
  #       committed) fails CI rather than breaking the SQLX_OFFLINE=true
  #       `cargo check` / release build that other jobs rely on.
  #
  # NOTE: today the repo deliberately uses RUNTIME `sqlx::query()` /
  # `query_as()` (not the compile-time macros) so crates build without a live
  # DATABASE_URL — see the comments in crates/db/src/repositories/*.rs and the
  # gap-83-1 TODO in rental.rs. With zero macro call-sites the `--check`
  # currently passes as a no-op; this gate locks in the convention so the day
  # someone converts a query to the macro form (gap-83-1) and forgets to run
  # `cargo sqlx prepare`, the offline cache drift is caught here.
  sqlx-migrations:
    runs-on: ubuntu-latest
    needs: [changes, check]
    # Not a required context; skips cleanly on pure-frontend PRs (#1672).
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ppt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: "backend"
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true

      # Pin sqlx-cli to the workspace's SQLx version (0.9, see
      # backend/Cargo.toml [workspace.dependencies]) so the offline-cache
      # format the CLI emits/checks matches what the macros expect.
      # Prebuilt binary via install-action (2026-07-22) instead of a
      # from-source `cargo install`; the version pin is preserved.
      - name: Install SQLx CLI
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.9.0

      # (a) Apply every migration against a fresh database. Fails the PR if any
      #     migration SQL is broken or order-dependent in a way that doesn't
      #     replay cleanly. Mirrors the rls-smoke-test / security-tests jobs.
      - name: Run database migrations
        working-directory: backend/crates/db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ppt_test
        run: sqlx database create && sqlx migrate run

      # (b) Verify the committed `.sqlx` offline cache matches the queries in
      #     the source. `--check` exits non-zero if `cargo sqlx prepare` would
      #     change anything (stale or missing entry), so it never mutates the
      #     tree — it only fails. Runs against the freshly migrated DB above so
      #     compile-time-checked macros (if/when added) validate against the
      #     real schema.
      - name: Verify SQLx offline cache is up to date
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ppt_test
        run: cargo sqlx prepare --check --workspace

  cargo-deny:
    runs-on: ubuntu-latest
    needs: changes
    # Not a required context; skips cleanly on pure-frontend PRs (#1672).
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: backend/Cargo.toml
          arguments: --workspace
          rust-version: stable

  # deny-ban-presence (GH #2127) was DELETED here 2026-07-22: it duplicated the
  # standalone deny-toml-ban-gate.yml workflow verbatim, which carries the
  # quick-xml half-range ban assertion (XXE/billion-laughs pin) as its own
  # always-producible context. One producer, no duplicate run.
