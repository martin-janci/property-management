name: Docker Build & Push (Multiplatform)

# Branch path for the backend images. The `v*` tag path lives in
# docker-build-tag.yml, in its own workflow because GitHub applies
# `on.push.paths` to tag pushes too and a tag push carries an empty commit list,
# so while `tags:` sat under a paths-filtered `push:` key a release tag built
# nothing. Both files call the same reusable workflow, so the images and their
# tags are identical whichever trigger fired.

# NO `paths:` filter on the branch push trigger either, on purpose.
#
# It used to be filtered on `backend/**`, while docker-frontend.yml was filtered
# on the DISJOINT `frontend/**`. A backend-only push therefore rewrote
# `ppt-api-server:dev` at the new commit and left `ppt-web:dev` pointing at
# whatever the last frontend push produced — so the five refs the auto-deploy
# pulls from one branch tag routinely came from different commits. That is the
# F-P8 shape, and no revision check can fix it downstream: the divergence is
# manufactured by the triggers. Building every image on every push to main/dev
# makes one push produce one commit's worth of images (a few extra minutes of
# runner time per push, which is the cheaper half of the trade).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      push:
        description: 'Push images to registry'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/docker-backend-images.yml
    with:
      # Only a workflow_dispatch may widen the publish gate past main/dev/`v*`.
      force_push: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}

  # Branch-keyed auto-deploy: main → prod, dev → staging.
  # Tag pushes never reach this job — they run docker-build-tag.yml, which has
  # no deploy job at all. release.yml handles tag pushes via the
  # `register-candidate → manual promote` flow.
  trigger-deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    # NO job-level `continue-on-error`. It used to be here so that an OIDC 403
    # (issue #950) did not paint a successful image build red — but it also
    # swallowed a deploy the deployer REFUSED, e.g. the 400 a mixed-revision
    # request now gets. The POST step below separates the two: transport,
    # 5xx and auth failures warn, everything else (a real 4xx from
    # /api/deploy) fails the job.
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Pick deploy target from branch
        id: target
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Get OIDC token for ppt-deploy
        uses: actions/github-script@v9
        id: oidc
        # Tolerated on purpose: an OIDC hiccup (e.g. onyx's auth.yaml being
        # edited) is infra, not a build defect. The POST step below turns the
        # missing token into a 401/403, which it also tolerates — while a 400
        # from the deployer, i.e. a REFUSED deploy, fails the job.
        continue-on-error: true
        with:
          script: |
            const token = await core.getIDToken('ppt-deploy');
            core.setOutput('token', token);

      - name: POST /api/deploy
        env:
          DEPLOY_URL: https://onyx.rlt.sk
          # We deploy by BRANCH tag (e.g. `main`, `dev`), not by `sha-<sha>`.
          # Both image workflows now build on EVERY push to main/dev (the
          # `paths:` filters were removed), so one push refreshes all six
          # images at one commit and the branch tag of each service converges
          # on that commit. Between the two workflow runs the refs can still
          # name different commits for a few minutes, which is why the
          # deployer only WARNS about a mixed revision on this path and
          # reserves the hard refusal for version-addressed promotes
          # (`BlueGreenSpec::require_single_revision`).
          BRANCH_TAG: ${{ steps.target.outputs.name == 'prod' && 'main' || 'dev' }}
          TARGET: ${{ steps.target.outputs.name }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -uo pipefail

          # No `-f`: we need the status code to tell "the deployer refused this
          # deploy" (must be red) from "the deployer was unreachable / the OIDC
          # token was rejected" (infra, tolerated). `-f` collapses both into
          # exit 22 and the job-level `continue-on-error` that used to sit here
          # painted BOTH green — a permanently refused deploy looked like a
          # successful run, which is how a mixed-revision staging could have
          # gone unnoticed all over again.
          body_file="$(mktemp)"
          code="$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X POST "$DEPLOY_URL/api/deploy" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"$BRANCH_TAG\", \"target\": \"$TARGET\"}")" || code="000"
          body="$(cat "$body_file")"
          rm -f "$body_file"
          echo "POST $DEPLOY_URL/api/deploy -> HTTP $code"
          echo "$body"

          case "$code" in
            2*)
              echo "Deploy of :$BRANCH_TAG to $TARGET accepted."
              ;;
            401|403)
              echo "::warning::deploy trigger not authorized (HTTP $code) — OIDC/infra, not a build failure. The images are pushed; re-run this job once auth is restored."
              ;;
            000|5*)
              echo "::warning::deploy trigger could not reach the deployer (HTTP $code) — infra, not a build failure. The images are pushed."
              ;;
            *)
              echo "::error::the deploy-server REFUSED this deploy (HTTP $code): $body"
              echo "The images were pushed, but $TARGET was NOT updated. This is a real failure — do not ignore it."
              exit 1
              ;;
          esac
