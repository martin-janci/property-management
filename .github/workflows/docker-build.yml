name: Docker Build & Push (Multiplatform)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker/backend/**'
      - '.github/workflows/docker-build.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push images to registry'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/martin-janci

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api-server, reality-server]

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/ppt-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.push == true) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shared cache scope: both matrix jobs (api-server + reality-server)
          # build the same workspace and produce both binaries in one cargo
          # invocation, so they should share a single GHA cache scope. Two
          # scopes blew past the 10 GB per-repo limit and caused evictions.
          cache-from: type=gha,scope=backend-shared
          cache-to: type=gha,mode=max,scope=backend-shared
          build-args: |
            BUILDPLATFORM=linux/amd64

      - name: Image size
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_PREFIX }}/ppt-${{ matrix.target }}:${{ steps.meta.outputs.version }} 2>/dev/null || true

  trigger-staging-deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get OIDC token for ppt-deploy
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('ppt-deploy');
            core.setOutput('token', token);

      - name: POST /api/deploy
        env:
          DEPLOY_URL: https://onyx.rlt.sk
          FULL_SHA: ${{ github.sha }}
        run: |
          # Short SHA matches `type=sha,prefix=` default in metadata-action (7 chars).
          SHORT_SHA="${FULL_SHA:0:7}"
          curl -fsS -X POST "$DEPLOY_URL/api/deploy" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"$SHORT_SHA\", \"target\": \"staging\"}"
