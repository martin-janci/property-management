name: Docker Build & Push (Multiplatform)

# Branch path for the backend images. The `v*` tag path lives in
# docker-build-tag.yml, deliberately WITHOUT a paths filter — GitHub applies
# `on.push.paths` to tag pushes too, and a tag push carries an empty commit
# list, so keeping `tags:` under this paths-filtered `push:` key meant a release
# tag built nothing. Both files call the same reusable workflow, so the images
# and their tags are identical whichever trigger fired.

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - 'docker/backend/**'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/docker-backend-images.yml'
      - '.github/actions/docker-image-tags/action.yml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push images to registry'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/docker-backend-images.yml
    with:
      # Only a workflow_dispatch may widen the publish gate past main/dev/`v*`.
      force_push: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}

  # Branch-keyed auto-deploy: main → prod, dev → staging.
  # Tag pushes never reach this job — they run docker-build-tag.yml, which has
  # no deploy job at all. release.yml handles tag pushes via the
  # `register-candidate → manual promote` flow.
  trigger-deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    # continue-on-error: deploy-trigger failures (e.g. OIDC 403 while onyx
    # auth.yaml is being updated) must not mark a successful image build red.
    # The images are already pushed when this job runs; a trigger failure is
    # an infra-side concern, not a build failure. See issue #950.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Pick deploy target from branch
        id: target
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Get OIDC token for ppt-deploy
        uses: actions/github-script@v9
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('ppt-deploy');
            core.setOutput('token', token);

      - name: POST /api/deploy
        env:
          DEPLOY_URL: https://onyx.rlt.sk
          # We deploy by BRANCH tag (e.g. `main`, `dev`), not by `sha-<sha>`.
          # docker-build.yml and docker-frontend.yml are paths-filtered on their
          # branch trigger, so a backend-only push on main only updates
          # `ppt-api-server:main` and friends; `ppt-web:sha-<sha>` for the same
          # SHA never exists, and a SHA-based deploy would 404 on those pulls.
          # The branch tag is rewritten by every successful build of either
          # workflow, so `:main` (or `:dev`) on each service image always points
          # at the most recent successful build of that service for that branch
          # — independent of which workflow last ran. Side effect: per-commit
          # precision is lost in the auto-deploy path; tag-based releases
          # (release.yml → /api/release with the bare semver) keep their
          # commit-specific semantics.
          BRANCH_TAG: ${{ steps.target.outputs.name == 'prod' && 'main' || 'dev' }}
          TARGET: ${{ steps.target.outputs.name }}
        run: |
          curl -fsS -X POST "$DEPLOY_URL/api/deploy" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"$BRANCH_TAG\", \"target\": \"$TARGET\"}"
