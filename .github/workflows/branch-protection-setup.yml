name: Branch-protection setup

# One-time (and idempotent) workflow that registers the repo's gate check
# contexts (see NEW_CHECKS below, e.g. "security-gate-conclusion",
# "deny-toml-ban-gate") as required status checks on the `dev` branch
# protection rule, and ensures "Require review from Code Owners" is
# enabled so CODEOWNERS entries actually block (#2127).
#
# WHY THIS EXISTS
# ---------------
# The security-test-gate.yml workflow fails a PR when it is labelled
# 'security' and ships without a test file.  However, a failing CI check
# is only blocking if it is listed as a "required status check" in the
# branch protection rule for `dev`.  Without that registration the gate
# is advisory — a repo admin can still merge a red PR.
#
# This workflow closes that gap by calling the GitHub REST API to add
# "security-gate-conclusion" to the required-status-checks list.  It is
# idempotent: running it twice is safe.
#
# HOW TO RUN
# ----------
#   gh workflow run branch-protection-setup.yml --ref dev
#   # or via the Actions UI: Actions → Branch-protection setup → Run workflow
#
# PERMISSIONS REQUIRED
# --------------------
# The GITHUB_TOKEN in a standard repository does NOT have the
# `administration:write` permission needed to edit branch protection.
# You must pass a PAT with that permission as the GH_ADMIN_TOKEN secret,
# OR a GitHub App installation token with the `administration` permission.
#
# Set the secret:
#   gh secret set GH_ADMIN_TOKEN --body "<pat>"
#
# If GH_ADMIN_TOKEN is not set the workflow will fail with a clear error
# rather than silently skipping.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run: print what would be changed without applying it'
        required: false
        type: boolean
        default: false
  # Self-test fixture: any change to this workflow or its extracted payload
  # builder exercises the round-trip payload logic against fixtures that
  # encode the #771/#923 "never weaken branch protection" contract, so a
  # future refactor that re-introduces a hardcoded/weakening payload is
  # caught in CI instead of silently downgrading `dev` protection on the
  # next workflow_dispatch run.
  push:
    paths:
      - '.github/workflows/branch-protection-setup.yml'
      - '.github/workflows/scripts/branch-protection-payload.py'
  pull_request:
    paths:
      - '.github/workflows/branch-protection-setup.yml'
      - '.github/workflows/scripts/branch-protection-payload.py'

jobs:
  apply-branch-protection:
    name: Register required status check on dev
    runs-on: ubuntu-latest
    # Only run the live apply path on a manual dispatch. On the push /
    # pull_request self-test trigger there is no GH_ADMIN_TOKEN and no
    # dry_run input, and we must never mutate real branch protection from
    # a PR — the `self-test` job below handles those events.
    if: github.event_name == 'workflow_dispatch'

    permissions:
      # contents:read is enough to call the REST API with GH_ADMIN_TOKEN.
      contents: read

    steps:
      - name: Validate GH_ADMIN_TOKEN is set
        env:
          TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ERROR: GH_ADMIN_TOKEN secret is not set."
            echo ""
            echo "This workflow requires a GitHub PAT (or GitHub App token) with"
            echo "the 'administration:write' repository permission."
            echo ""
            echo "Set the secret with:"
            echo "  gh secret set GH_ADMIN_TOKEN --body \"<your-pat>\""
            exit 1
          fi
          echo "GH_ADMIN_TOKEN is set."

      - name: Fetch current branch protection for dev
        id: current
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Fetching branch protection for dev..."
          PROTECTION=$(gh api "repos/$REPO/branches/dev/protection" 2>&1) || {
            echo "WARNING: branch protection not yet configured on dev (404 is normal for a new rule)."
            echo "Will create minimal protection rule with required status check."
            echo "protection_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "$PROTECTION" | python3 -m json.tool --no-ensure-ascii 2>/dev/null || echo "$PROTECTION"
          echo "protection_exists=true" >> "$GITHUB_OUTPUT"

          # Extract existing required status check contexts so we can merge them.
          EXISTING=$(echo "$PROTECTION" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          checks = d.get('required_status_checks') or {}
          contexts = checks.get('contexts', [])
          checks_obj = checks.get('checks', [])
          # prefer new-style checks array
          if checks_obj:
              print('\n'.join(c['context'] for c in checks_obj))
          else:
              print('\n'.join(contexts))
          " 2>/dev/null || echo "")
          echo "Existing required checks:"
          echo "$EXISTING"
          {
            echo "existing_checks<<EOF"
            echo "$EXISTING"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # Persist the FULL current protection object so the apply step can
          # round-trip it. We must never blindly PUT a hardcoded payload — that
          # would silently revert any stronger setting (strict mode, extra
          # required approvals, code-owner reviews, push restrictions) that the
          # rule already has. The apply step rebuilds the payload FROM this.
          {
            echo "protection_json<<PROTECTION_EOF"
            echo "$PROTECTION"
            echo "PROTECTION_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Apply required status check
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
          EXISTING_CHECKS: ${{ steps.current.outputs.existing_checks }}
          PROTECTION_JSON: ${{ steps.current.outputs.protection_json }}
          PROTECTION_EXISTS: ${{ steps.current.outputs.protection_exists }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Gate check contexts that must be REQUIRED on the dev protection
          # rule. A gate workflow that is not listed here is advisory-only —
          # its failure does not block a merge. The context of a GitHub
          # Actions check is the job's `name`, so keep this list in sync
          # with the gate job names.
          NEW_CHECKS=$(printf '%s\n' \
            "security-gate-conclusion" \
            "deny-toml-ban-gate")

          # Build the merged list of required status checks (existing ∪ new).
          MERGED=$(python3 -c "
          existing_raw = '''$EXISTING_CHECKS'''
          new_raw = '''$NEW_CHECKS'''

          existing = [c.strip() for c in existing_raw.strip().splitlines() if c.strip()]
          new = [c.strip() for c in new_raw.strip().splitlines() if c.strip()]

          print('\n'.join(existing + [c for c in new if c not in existing]))
          ")

          echo "Required status checks after merge:"
          echo "$MERGED"

          # Determine which of the gate checks are not yet registered.
          MISSING=$(python3 -c "
          existing_raw = '''$EXISTING_CHECKS'''
          new_raw = '''$NEW_CHECKS'''

          existing = [c.strip() for c in existing_raw.strip().splitlines() if c.strip()]
          new = [c.strip() for c in new_raw.strip().splitlines() if c.strip()]

          print('\n'.join(c for c in new if c not in existing))
          ")

          # Is "Require review from Code Owners" already enabled? Without it
          # every CODEOWNERS entry (backend/deny.toml, Cargo.toml/Cargo.lock
          # guards) is advisory-only — see #2127. The payload builder
          # strengthens it to true, so a run is needed while it is off.
          CODEOWNER_CURRENT=$(python3 -c "
          import json
          raw = '''$PROTECTION_JSON'''
          try:
              d = json.loads(raw) if raw.strip() else {}
          except Exception:
              d = {}
          prr = d.get('required_pull_request_reviews') or {}
          print('true' if prr.get('require_code_owner_reviews') else 'false')
          ")

          if [ -z "$MISSING" ] && [ "$CODEOWNER_CURRENT" = "true" ]; then
            echo "INFO: all gate checks are already required and code-owner reviews are enabled — nothing to do."
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            if [ -n "$MISSING" ]; then
              echo "DRY-RUN: would add these to dev branch required status checks:"
              echo "$MISSING" | sed 's/^/  - /'
            fi
            if [ "$CODEOWNER_CURRENT" != "true" ]; then
              echo "DRY-RUN: would enable require_code_owner_reviews on dev."
            fi
            echo "DRY-RUN: no changes applied."
            exit 0
          fi

          # Build JSON payload for PUT /repos/{owner}/{repo}/branches/{branch}/protection
          #
          # SAFETY: GitHub's PUT replaces the ENTIRE protection object — any field
          # we omit (or send weaker) is overwritten. So we must NOT ship a fixed
          # payload. Instead we round-trip: start from the CURRENT protection that
          # the previous step fetched, then *only add/strengthen*:
          #   - add the new required status checks to the existing contexts,
          #   - force strict=true (never downgrade an existing strict=true),
          #   - force require_code_owner_reviews=true (#2127, strengthen-only),
          #   - PRESERVE existing restrictions, PR-review rules, enforce_admins,
          #     linear-history, conversation-resolution, etc. exactly as-is.
          # If no protection existed yet, fall back to a safe baseline (strict=true,
          # 1 approval, enforce_admins, no push restrictions).
          #
          # The builder lives in scripts/branch-protection-payload.py so it can be
          # regression-tested (see the `self-test` job in this workflow). It reads
          # the same PROTECTION_JSON / PROTECTION_EXISTS / MERGED env vars set
          # above. Keep this a single source of truth — do NOT re-inline the
          # builder here, or the #771/#923 "never weaken protection" guarantee
          # stops being tested.
          PAYLOAD=$(PROTECTION_JSON="$PROTECTION_JSON" \
            PROTECTION_EXISTS="$PROTECTION_EXISTS" \
            MERGED="$MERGED" \
            python3 .github/workflows/scripts/branch-protection-payload.py)

          echo "Payload to be sent (round-tripped from current protection):"
          echo "$PAYLOAD" | python3 -m json.tool --no-ensure-ascii 2>/dev/null || echo "$PAYLOAD"

          echo "Sending PUT to branch protection API..."
          gh api -X PUT "repos/$REPO/branches/dev/protection" \
            --input - <<< "$PAYLOAD"

          echo ""
          echo "SUCCESS: these are now required status checks on dev:"
          echo "$NEW_CHECKS" | sed 's/^/  - /'
          echo "and require_code_owner_reviews is enforced (strengthen-only)."
          echo ""
          echo "Effect:"
          echo "  - Any PR labelled 'security' that ships without a test file will have"
          echo "    'security-gate-conclusion' fail, which blocks merge."
          echo "  - PRs without the 'security' label: 'security-test-gate' is skipped →"
          echo "    'security-gate-conclusion' succeeds → merge is not blocked."
          echo "  - Any PR that removes a quick-xml half-range ban line from"
          echo "    backend/deny.toml fails 'deny-toml-ban-gate', which blocks merge."
          echo "  - CODEOWNERS-guarded paths (backend/deny.toml, Cargo.toml/lock)"
          echo "    now require a code-owner review before merge."

      - name: Self-check — verify gate checks + code-owner reviews are required
        # Idempotent audit step. Reads back required_status_checks and
        # required_pull_request_reviews from the API after the apply step ran
        # and fails the run if any gate check is missing or code-owner
        # reviews are not enforced. This makes the workflow self-auditing:
        # a green run guarantees the gates are registered (#2127).
        #
        # In dry-run mode this only warns (the apply step did not patch).
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Keep in sync with NEW_CHECKS in the apply step above.
          REQUIRED_CHECKS=$(printf '%s\n' \
            "security-gate-conclusion" \
            "deny-toml-ban-gate")

          echo "Reading back required status checks for dev..."
          RESPONSE=$(gh api "repos/$REPO/branches/dev/protection/required_status_checks" 2>&1) || {
            echo "ERROR: could not fetch required status checks (branch may not be protected)."
            echo "$RESPONSE"
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY-RUN: skipping hard failure."
              exit 0
            fi
            exit 1
          }

          echo "Raw API response:"
          echo "$RESPONSE" | python3 -m json.tool --no-ensure-ascii 2>/dev/null || echo "$RESPONSE"

          NAMES=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          checks = d.get('checks') or []
          contexts = d.get('contexts') or []
          names = [c['context'] for c in checks] if checks else contexts
          print('\n'.join(names))
          ")

          echo ""
          echo "Required status checks on dev:"
          if [ -z "$NAMES" ]; then
            echo "  (none)"
          else
            echo "$NAMES" | sed 's/^/  - /'
          fi

          MISSING=""
          while IFS= read -r required; do
            [ -n "$required" ] || continue
            if ! echo "$NAMES" | grep -qxF "$required"; then
              MISSING="$MISSING $required"
            fi
          done <<< "$REQUIRED_CHECKS"

          if [ -z "$MISSING" ]; then
            echo ""
            echo "OK: all gate checks are registered as required status checks on dev."
          else
            echo ""
            echo "ERROR: NOT in the required status checks for dev:$MISSING"
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY-RUN: not failing the run (apply step did not patch)."
              exit 0
            fi
            exit 1
          fi

          # #2127 finding 2: CODEOWNERS entries only block if branch
          # protection enforces "Require review from Code Owners". Assert it.
          echo ""
          echo "Reading back required_pull_request_reviews for dev..."
          CODEOWNER=$(gh api "repos/$REPO/branches/dev/protection/required_pull_request_reviews" \
            --jq '.require_code_owner_reviews' 2>/dev/null || echo "unavailable")
          if [ "$CODEOWNER" = "true" ]; then
            echo "OK: require_code_owner_reviews is enabled on dev — CODEOWNERS entries are blocking."
          else
            echo "ERROR: require_code_owner_reviews is '$CODEOWNER' on dev — CODEOWNERS"
            echo "entries (backend/deny.toml, Cargo.toml/Cargo.lock guards) are advisory-only (#2127)."
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY-RUN: not failing the run (apply step did not patch)."
              exit 0
            fi
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "## Branch Protection Setup" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`dev\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Required checks | \`security-gate-conclusion\`, \`deny-toml-ban-gate\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Code-owner reviews | enforced (strengthen-only) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry-run | $DRY_RUN |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run \`gh api repos/\$REPO/branches/dev/protection\` to verify." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Self-test fixture for the round-trip payload builder (regression test
  # for #771/#923 — the "never weaken branch protection" fix shipped
  # without one).
  #
  # Runs branch-protection-payload.py against hand-written fixtures and
  # asserts that stronger existing settings (extra approvals, code-owner
  # reviews, push restrictions, linear history, conversation resolution,
  # strict mode) are PRESERVED and only the new required check is appended.
  # If a future edit re-inlines a hardcoded/weakening payload, this job
  # fails BEFORE the live workflow downgrades real `dev` protection.
  # ---------------------------------------------------------------------
  self-test:
    name: Self-test — branch-protection payload builder
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Run fixture-based payload-builder tests
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/branch-protection-payload.py --self-test
