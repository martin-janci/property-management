name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: backend
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        working-directory: backend
        run: cargo build --workspace

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check
    # The api-server integration tests in `tests/*.rs` use `#[sqlx::test]`,
    # which spins up a fresh template database per test from
    # `DATABASE_URL`. Without a Postgres service those tests would fail at
    # connection time, so we provide one matching the setup in
    # `backend.yml`. (DB-heavy crate tests in `crates/db/tests/*` are
    # marked `#[ignore]` and continue to run only in the dedicated
    # RLS Penetration Tests job below.)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true

      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
          RUST_ENV: development
        run: cargo test --workspace

  integration-tests:
    name: RLS Penetration Tests
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ppt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ppt_test
        run: |
          cargo install sqlx-cli --no-default-features --features postgres || true
          sqlx database create || true
          sqlx migrate run --source crates/db/migrations

      - name: Create RLS test user
        env:
          PGPASSWORD: postgres
        run: |
          # Create a non-superuser role for RLS testing
          # Superusers bypass RLS even with FORCE ROW LEVEL SECURITY
          psql -h localhost -U postgres -d ppt_test <<EOF
          CREATE ROLE rls_test_user WITH LOGIN PASSWORD 'rls_test_pass' NOBYPASSRLS;
          GRANT ALL ON ALL TABLES IN SCHEMA public TO rls_test_user;
          GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO rls_test_user;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO rls_test_user;
          EOF

      - name: Run RLS penetration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://rls_test_user:rls_test_pass@localhost:5432/ppt_test
        run: |
          cargo test --test rls_penetration_tests -- --ignored --test-threads=1
