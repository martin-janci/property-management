name: Script exec-bit gate

# Why this exists
# ---------------
# Issue #2081 / #2110: the executable bit on
# .github/workflows/scripts/check-ignore-reason.sh silently reverted from
# 100755 to 100644 because the fix branch was pushed via the GitHub
# git-data API, which forces mode 100644 on every blob. The mode-only
# change never landed, and the issue was closed while the file was still
# non-executable — a class of drift that is invisible in a normal diff
# view and easy to miss in review.
#
# This gate asserts that every tracked shell script under
# .github/workflows/scripts/ carries the executable bit (git mode 100755).
# These are the helper scripts invoked by other workflows; keeping them
# executable matches convention and prevents a repeat of the silent
# mode revert. The check reads git's index modes directly (git ls-files
# -s), so it is filesystem-independent and DB-free.
#
# IMPORTANT — this gate only BLOCKS a regression if it is wired as a
# REQUIRED status check on the `dev` branch-protection rule / ruleset.
# The pull_request trigger below is path-filtered and the push trigger
# runs post-merge (advisory only). If the job
# "Workflow scripts must be executable (100755)" is NOT marked required
# in branch protection, a future exec-bit revert PR can still merge green
# and defeat the gate. That required-check wiring is a repo-settings /
# operator action (out of code scope); see issue #2128. Do not remove
# this dependency silently on a settings change.
#
# SCOPE — this gate is deliberately narrow: it guards only the workflow
# helper scripts under .github/workflows/scripts/. Other tracked *.sh
# meant to be run directly (e.g. scripts/*.sh) are NOT covered here.
# Broadening the gate to an explicit allowlist of runnable repo scripts
# is tracked separately as a low-priority hygiene item (issue #2128,
# "better approach"); it is kept out of this file to avoid coupling
# unrelated mode fixes across docker/, scripts/, and .research/ to this
# workflow-scripts guard.

on:
  pull_request:
    paths:
      - '.github/workflows/scripts/**'
      - '.github/workflows/script-exec-bit-gate.yml'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/scripts/**'
      - '.github/workflows/script-exec-bit-gate.yml'

permissions:
  contents: read

jobs:
  exec-bit-gate:
    name: "Workflow scripts must be executable (100755)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert *.sh under .github/workflows/scripts are 100755
        run: |
          set -euo pipefail
          offenders="$(git ls-files -s -- '.github/workflows/scripts/*.sh' \
            | awk '$1 != "100755" { print $1 "  " $4 }')"
          if [ -n "$offenders" ]; then
            echo "::error::These workflow scripts are missing the executable bit (expected 100755):"
            echo "$offenders"
            echo ""
            echo "Fix with: git update-index --chmod=+x <path> && git commit"
            echo "Note: pushing a mode-only change via the GitHub git-data API"
            echo "(e.g. push_files) forces 100644 and will NOT restore the bit."
            echo "Use a real 'git push' of a local commit instead."
            exit 1
          fi
          echo "All shell scripts under .github/workflows/scripts are executable (100755)."
