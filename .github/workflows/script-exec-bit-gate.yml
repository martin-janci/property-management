name: Script exec-bit gate

# Why this exists
# ---------------
# Issue #2081 / #2110: the executable bit on
# .github/workflows/scripts/check-ignore-reason.sh silently reverted from
# 100755 to 100644 because the fix branch was pushed via the GitHub
# git-data API, which forces mode 100644 on every blob. The mode-only
# change never landed, and the issue was closed while the file was still
# non-executable — a class of drift that is invisible in a normal diff
# view and easy to miss in review.
#
# This gate asserts that every tracked shell script under
# .github/workflows/scripts/ carries the executable bit (git mode 100755).
# These are the helper scripts invoked by other workflows; keeping them
# executable matches convention and prevents a repeat of the silent
# mode revert. The check reads git's index modes directly (git ls-files
# -s), so it is filesystem-independent and DB-free.
#
# It also guards an explicit ALLOWLIST of repo-level scripts that are
# documented to be invoked directly (./scripts/foo.sh) rather than via an
# interpreter — see RUNNABLE_SCRIPTS below (#2128 finding 2).
#
# REQUIRED-CHECK DEPENDENCY (#2128)
# ---------------------------------
# This gate only BLOCKS a merge if its job — context
# "Workflow scripts must be executable (100755)" — is registered as a
# required status check on the `dev` branch-protection rule. Otherwise a
# red run is advisory and an exec-bit revert PR can still merge green.
# Registration is handled by branch-protection-setup.yml (NEW_CHECKS
# list); keep that list in sync with this job's name, and do not remove
# the check from branch protection without removing it there too.
#
# The pull_request trigger is intentionally NOT path-filtered: a required
# status check that is skipped by a path filter never reports a status,
# which would wedge every PR that does not touch the filtered paths. The
# job costs one checkout plus `git ls-files`, so running it on every PR
# is cheap.

on:
  pull_request:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/scripts/**'
      - '.github/workflows/script-exec-bit-gate.yml'

permissions:
  contents: read

jobs:
  exec-bit-gate:
    name: "Workflow scripts must be executable (100755)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert *.sh under .github/workflows/scripts are 100755
        run: |
          set -euo pipefail
          # Allowlist of repo-level scripts documented to be run DIRECTLY
          # (./scripts/foo.sh), not via `bash foo.sh` — they need the exec
          # bit too (#2128 finding 2). Scripts only ever invoked through an
          # interpreter or COPY'd + chmod'ed in a Dockerfile (e.g.
          # docker/nginx/render-template.sh) are intentionally not listed.
          RUNNABLE_SCRIPTS='
          scripts/build-ios.sh
          scripts/generate-rn-app-icons.sh
          '
          offenders="$(git ls-files -s -- '.github/workflows/scripts/*.sh' $RUNNABLE_SCRIPTS \
            | awk '$1 != "100755" { print $1 "  " $4 }')"
          if [ -n "$offenders" ]; then
            echo "::error::These workflow scripts are missing the executable bit (expected 100755):"
            echo "$offenders"
            echo ""
            echo "Fix with: git update-index --chmod=+x <path> && git commit"
            echo "Note: pushing a mode-only change via the GitHub git-data API"
            echo "(e.g. push_files) forces 100644 and will NOT restore the bit."
            echo "Use a real 'git push' of a local commit instead."
            exit 1
          fi
          echo "All workflow scripts and allowlisted runnable scripts are executable (100755)."
