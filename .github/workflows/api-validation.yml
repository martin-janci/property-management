name: API Validation

on:
  push:
    paths:
      # TypeSpec / OpenAPI source of truth — regenerating the clients.
      - 'docs/api/**'
      # Generated clients themselves: catch drift committed straight into the
      # tree (hand-edits, stale regen) even when docs/api/** was untouched.
      - 'frontend/packages/api-client/**'
      - 'frontend/packages/reality-api-client/**'
      # The gate workflow itself.
      - '.github/workflows/api-validation.yml'
  pull_request:
    paths:
      - 'docs/api/**'
      - 'frontend/packages/api-client/**'
      - 'frontend/packages/reality-api-client/**'
      - '.github/workflows/api-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install TypeSpec dependencies
        run: |
          cd docs/api/typespec
          npm install

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Install oasdiff
        run: |
          curl -sL https://github.com/Tufin/oasdiff/releases/download/v1.10.0/oasdiff_1.10.0_linux_amd64.tar.gz | tar xz
          sudo mv oasdiff /usr/local/bin/

      - name: Compile TypeSpec
        run: |
          cd docs/api/typespec
          npx tsp compile .

      - name: Lint OpenAPI
        run: spectral lint docs/api/generated/openapi.yaml -r docs/api/rules/spectral.yaml

      - name: Check Breaking Changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          if [ -f "origin/${{ github.base_ref }}:docs/api/generated/openapi.yaml" ]; then
            oasdiff breaking origin/${{ github.base_ref }}:docs/api/generated/openapi.yaml docs/api/generated/openapi.yaml
          fi

      - name: Upload OpenAPI Spec
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: docs/api/generated/openapi.yaml

  generate-sdks:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download OpenAPI Spec
        uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          path: docs/api/generated

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Generate TypeScript SDK
        run: |
          # Pin @hey-api/openapi-ts and co-install its `typescript` peer so the
          # generator can initialize. An unpinned `npm install -g` pulled a
          # newer release without typescript present, crashing at init with
          # "Cannot read properties of undefined (reading 'NewLineKind')".
          # Versions mirror frontend/packages/api-client (openapi-ts ^0.99.0,
          # typescript ^5.3 -> resolved 5.9.3 in pnpm-lock).
          npm install --no-save @hey-api/openapi-ts@0.99.0 typescript@5.9.3
          npx openapi-ts -i docs/api/generated/openapi.yaml -o frontend/packages/api-client/src/generated

      # Drift gate (2026-07-22): the step above regenerates the SDK directly
      # over the COMMITTED tree (frontend/packages/api-client/src/generated),
      # so a plain `git diff` is a deterministic check that the committed
      # client matches the spec. `git add -N` registers newly generated
      # (untracked) files as intent-to-add so they show up in the diff too.
      # @ppt/reality-api-client is gated the same way below (#2556): it shares
      # the same openapi.yaml source and the same `openapi-ts` invocation, so
      # its committed tree must match byte-for-byte too.
      - name: Check generated TypeScript SDK is committed (drift gate)
        run: |
          set -euo pipefail
          sdk_path=frontend/packages/api-client/src/generated
          git add -N "$sdk_path"
          if ! git diff --exit-code -- "$sdk_path"; then
            echo "::error::Generated TypeScript SDK ($sdk_path) is out of date with docs/api/typespec."
            echo "" >&2
            echo "The committed API client does not match what the current TypeSpec/OpenAPI spec generates." >&2
            echo "Regenerate and commit the result:" >&2
            echo "  cd docs/api/typespec && npm install && npx tsp compile ." >&2
            echo "  cd frontend && pnpm install && pnpm generate-api" >&2
            echo "  git add docs/api/generated frontend/packages/api-client/src/generated && git commit" >&2
            exit 1
          fi
          echo "OK: committed API client matches the generated SDK."

      - name: Upload TypeScript SDK
        uses: actions/upload-artifact@v7
        with:
          name: typescript-sdk
          path: frontend/packages/api-client/src/generated

      - name: Generate Reality TypeScript SDK
        run: |
          # @ppt/reality-api-client is generated from the SAME openapi.yaml with
          # the SAME `openapi-ts` invocation as @ppt/api-client (see each
          # package's `generate` script), so we reuse the generator installed
          # above and regenerate directly over the committed reality tree.
          npx openapi-ts -i docs/api/generated/openapi.yaml -o frontend/packages/reality-api-client/src/generated

      # Drift gate (#2556): mirror of the @ppt/api-client gate above. The step
      # above regenerates over the COMMITTED reality tree, so a plain `git diff`
      # deterministically checks the committed client matches the spec.
      - name: Check generated Reality TypeScript SDK is committed (drift gate)
        run: |
          set -euo pipefail
          sdk_path=frontend/packages/reality-api-client/src/generated
          git add -N "$sdk_path"
          if ! git diff --exit-code -- "$sdk_path"; then
            echo "::error::Generated Reality TypeScript SDK ($sdk_path) is out of date with docs/api/typespec."
            echo "" >&2
            echo "The committed Reality API client does not match what the current TypeSpec/OpenAPI spec generates." >&2
            echo "Regenerate and commit the result:" >&2
            echo "  cd docs/api/typespec && npm install && npx tsp compile ." >&2
            echo "  cd frontend && pnpm install && pnpm generate-reality-api" >&2
            echo "  git add docs/api/generated frontend/packages/reality-api-client/src/generated && git commit" >&2
            exit 1
          fi
          echo "OK: committed Reality API client matches the generated SDK."

      - name: Upload Reality TypeScript SDK
        uses: actions/upload-artifact@v7
        with:
          name: reality-typescript-sdk
          path: frontend/packages/reality-api-client/src/generated
