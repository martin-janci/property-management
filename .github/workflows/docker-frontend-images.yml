name: Docker Frontend Images (reusable)

# Reusable build + push of every frontend service image.
#
# It has no event trigger of its own on purpose: the callers own the triggers,
# so the paths-filtered branch trigger (docker-frontend.yml) and the
# deliberately UNFILTERED tag trigger (docker-frontend-tag.yml) can never drift
# apart. See docker-backend-images.yml for why they must be separate workflows.

on:
  workflow_call:
    inputs:
      force_push:
        description: >-
          Publish even when the ref is neither main, dev nor a `v*` tag. Wired
          to the caller's workflow_dispatch `push` input: the deploy-server's
          `worktree open` path dispatches this build for a feature branch and
          then pulls `ppt-<svc>:<branch>` (see
          backend/servers/deploy-server/src/api/worktree.rs), so a dispatch must
          still be able to publish a branch tag.
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/martin-janci

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Same publish gate as the backend images — see docker-backend-images.yml.
      PUSH_IMAGES: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v') || inputs.force_push) }}
    strategy:
      matrix:
        include:
          - target: ppt-web
            dockerfile: docker/frontend/ppt-web.Dockerfile
          - target: ppt-reality-web
            dockerfile: docker/frontend/reality-web.Dockerfile
          - target: ppt-admin-web
            dockerfile: docker/frontend/admin-web.Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag set lives in exactly one place, shared with docker-build.yml.
      - name: Docker metadata
        id: meta
        uses: ./.github/actions/docker-image-tags
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.PUSH_IMAGES }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          # Version identity (T6). Baked into the bundle (VITE_/NEXT_PUBLIC_
          # mirrors are derived inside the Dockerfiles) and into the OCI labels,
          # and served at runtime by `GET /version`.
          build-args: |
            VITE_API_URL=/api
            VITE_WS_URL=/ws
            VITE_API_DEFAULT=worktree
            APP_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      - name: Verify pushed manifest
        if: env.PUSH_IMAGES == 'true'
        env:
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}:${{ steps.meta.outputs.version }}
          EXPECTED_VERSION: ${{ steps.meta.outputs.app_version }}
        run: |
          set -euo pipefail
          # No `|| true` and no `2>/dev/null`: a tag we just pushed that does
          # not resolve is a build failure.
          docker buildx imagetools inspect "$IMAGE_REF"

          # And the image must be able to say which version it is. The label is
          # the only thing a deployer can read without starting the container,
          # so an image whose `org.opencontainers.image.version` is missing — or
          # is a branch name instead of the release version — is a broken image,
          # not a cosmetic problem. See F-P9.
          got="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Image}}' \
            | jq -r '[ .. | objects | .config? | objects
                       | (.Labels // .labels) | objects
                       | ."org.opencontainers.image.version"? // empty ] | first // ""')"
          if [ "$got" != "$EXPECTED_VERSION" ]; then
            echo "::error::$IMAGE_REF has org.opencontainers.image.version='$got', expected '$EXPECTED_VERSION'"
            exit 1
          fi
          echo "$IMAGE_REF org.opencontainers.image.version=$got"
