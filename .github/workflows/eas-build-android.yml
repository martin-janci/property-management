name: EAS Android Build

# Epic 85 - Story 85.2: Android Release Build Configuration
#
# Triggers:
#   - Manual dispatch (all profiles)
#   - Push to dev touching mobile code => staging APK build (internal distribution)
#
# Required GitHub secrets (repo/org level):
#   EXPO_TOKEN       -- EAS Personal Access Token (expo.dev > Account > Access Tokens)
#   EXPO_PROJECT_ID  -- EAS project UUID from expo.dev project settings
#
# EAS credentials (stored in Expo, NOT in GitHub secrets):
#   Managed via: eas credentials --platform android
#   - Android keystore (generated with scripts/setup-android-keystore.sh)
#   - Key alias, keystore password, key password
#
# Firebase (push notifications -- Android only):
#   GOOGLE_SERVICES_JSON secret must be set in the EAS project:
#     eas secret:create --scope project --name GOOGLE_SERVICES_JSON \
#       --value "$(base64 -w0 frontend/apps/mobile/google-services.json)"
#   The secret is injected into the build container automatically.
#
# Google Play submission (production profile):
#   Requires a service account JSON file with Release Manager permissions.
#   Path configured in eas.json submit.production.android.serviceAccountKeyPath.
#   Store as EAS secret or provide via CI artifact upload.
#
# One-time setup checklist:
#   1. expo login  (or set EXPO_TOKEN)
#   2. eas build:configure    (eas.json already present)
#   3. eas credentials --platform android  (upload keystore interactively)
#   4. Add EXPO_TOKEN + EXPO_PROJECT_ID to GitHub repository secrets
#   5. Upload google-services.json as EAS secret (see above)
#   6. Configure Google Play service account for eas submit

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      submit:
        description: 'Submit to Google Play after build (production profile only)'
        required: false
        default: false
        type: boolean

  push:
    branches:
      - dev
    paths:
      - 'frontend/apps/mobile/**'
      - '.github/workflows/eas-build-android.yml'

  # Production builds are triggered manually via workflow_dispatch.
  # The release workflow may also call this workflow after tagging.

jobs:
  build-android:
    name: EAS Android Build (${{ github.event.inputs.profile || 'staging' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-mobile-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-mobile-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Typecheck mobile
        working-directory: frontend/apps/mobile
        run: pnpm typecheck

      # issue #767 (#6) — fail fast before invoking EAS when the required
      # repo/org secrets are absent. Without this the build proceeds to
      # `eas build` and fails deep in the EAS pipeline with an opaque auth
      # error. Note: the real production API_BASE_URL / WS_BASE_URL live in the
      # EAS *project* secret store (not GitHub secrets) — they cannot be
      # verified here, so this only guards the GitHub-level prerequisites.
      - name: Verify required EAS secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$EXPO_TOKEN" ] && missing="$missing EXPO_TOKEN"
          [ -z "$EXPO_PROJECT_ID" ] && missing="$missing EXPO_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing"
            echo "Set them under repo/org Settings → Secrets and variables → Actions."
            echo "See the header of this workflow for the one-time setup checklist."
            exit 1
          fi
          echo "Required EAS secrets present."

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine build profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
          else
            # Push to dev => staging APK build (internal distribution)
            echo "profile=staging" >> $GITHUB_OUTPUT
          fi

      - name: Run EAS build (Android)
        working-directory: frontend/apps/mobile
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          eas build \
            --platform android \
            --profile ${{ steps.profile.outputs.profile }} \
            --non-interactive \
            --no-wait

      - name: Surface EAS build URL in job summary (issue #715)
        # --no-wait above returns the moment the build is enqueued; the EAS
        # job then runs minutes later on expo.dev with no feedback in
        # GitHub Actions. Look up the just-enqueued build and write its URL
        # to the step summary so the developer has a direct link instead of
        # navigating expo.dev manually. Non-fatal — never block the build
        # on the summary write.
        if: always()
        working-directory: frontend/apps/mobile
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          set +e
          build_json=$(eas build:list --platform android --limit 1 --non-interactive --json 2>/dev/null)
          build_url=$(echo "$build_json" | jq -r '.[0].buildProfile as $bp | "\(.[0].id) [\(.[0].status)] profile=\($bp) → https://expo.dev/accounts/_/projects/_/builds/\(.[0].id)"' 2>/dev/null)
          {
            echo "## EAS Android build (profile=${{ steps.profile.outputs.profile }})"
            if [ -n "$build_url" ] && [ "$build_url" != "null" ]; then
              echo ""
              echo "Latest build: $build_url"
              echo ""
              echo "Raw JSON:"
              echo '```json'
              echo "$build_json" | jq '.[0] | {id, status, platform, buildProfile, createdAt}'
              echo '```'
            else
              echo ""
              echo "Could not read build via \`eas build:list\` — check expo.dev directly."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit to Google Play
        # Only submit when: manual dispatch + submit=true + production profile
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.submit == 'true' &&
          steps.profile.outputs.profile == 'production'
        working-directory: frontend/apps/mobile
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          eas submit \
            --platform android \
            --profile production \
            --non-interactive \
            --latest
