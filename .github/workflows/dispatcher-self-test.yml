name: dispatcher-self-test

on:
  pull_request:
    paths:
      - ".research/dispatcher-prompt.md"
      - ".research/dispatcher-self-test.sh"
      - ".research/backlog-refill.sh"
      - ".research/backlog-reconcile.sh"
      - ".research/retry-remint.sh"
      - ".research/issue-ingest.sh"
      - ".research/mcp-push-size-guard.sh"
      - ".research/mobile-native-gate.sh"
      - ".research/test-backlog-refill.sh"
      - ".research/test-backlog-reconcile.sh"
      - ".research/test-retry-remint.sh"
      - ".research/test-issue-ingest.sh"
      - ".research/test-mcp-push-size-guard.sh"
      - ".research/test-mobile-native-gate.sh"
      - ".research/management/assignments.json"
      - ".claude/skills/ppt-implement/**"
      - ".claude/skills/ppt-pr-merge/**"
      - ".claude/skills/ppt-review-merged/**"
      - ".github/workflows/dispatcher-self-test.yml"

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GC2 (goal-check.sh) compares the current done-story count against
          # HEAD's coverage.json via `git show HEAD:…`. A shallow clone makes
          # that read silently return nothing, which used to be a silent pass
          # (issue #700). Pull the full history so the baseline is always
          # available; the script also reports `(no-baseline)` explicitly if
          # it ever isn't.
          fetch-depth: 0
      - name: dispatcher schema + invariant self-test
        run: bash .research/dispatcher-self-test.sh
      - name: backlog-refill behavioral smoke test
        run: bash .research/test-backlog-refill.sh
      - name: backlog-reconcile behavioral smoke test
        run: bash .research/test-backlog-reconcile.sh
      - name: retry-remint behavioral smoke test
        run: bash .research/test-retry-remint.sh
      - name: issue-ingest behavioral smoke test
        run: bash .research/test-issue-ingest.sh
      - name: mcp-push-size-guard behavioral smoke test
        run: bash .research/test-mcp-push-size-guard.sh
      - name: mobile-native-gate behavioral smoke test
        run: bash .research/test-mobile-native-gate.sh
      - name: goal-check (enforcing)
        env:
          GOAL_CHECK_ENFORCE: "1"
        run: |
          chmod +x .research/goal-check.sh
          ./.research/goal-check.sh
      - name: scope-check unit tests
        run: bash .claude/skills/ppt-implement/scripts/test-scope-check.sh
