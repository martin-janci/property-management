name: Skills Smoke

on:
  push:
    branches: [main, dev]
    paths:
      - '.claude/skills/**'
      - '.research/**'
      - '.github/workflows/skills-smoke.yml'
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.research/**'
      - '.github/workflows/skills-smoke.yml'

jobs:
  smoke:
    name: verify-all.sh --quick
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run skill smoke checks (quick mode)
        env:
          SKIP_NETWORK: "1"
        run: ./.claude/skills/verify-all.sh --quick
