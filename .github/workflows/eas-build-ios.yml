name: EAS iOS Build

# Epic 85 - Story 85.2: iOS Release Build Configuration
#
# Health confirmation (2026-06-17, pm-devops):
#   A prior DevOps run (2026-05-27) flagged the action pins below as broken
#   `@v6`. Re-verified against upstream tag listings: all pins resolve to real
#   major-version tags and the workflow YAML parses cleanly.
#     - actions/checkout@v7        -> v6.0.3 (v6 major tag exists)
#     - actions/setup-node@v7      -> v6.4.0 (v6 major tag exists)
#     - pnpm/action-setup@v6       -> v6.0.9 (v6 major tag exists)
#     - actions/cache@v6           -> v5.0.5 (v5 major tag exists)
#     - expo/expo-github-action@v9 -> 9.0.0  (v9 major tag exists)
#   eas-cli is provisioned by expo/expo-github-action with `eas-version: latest`
#   (no separate pin required). No fix needed — pins are valid as of this date.
#
# Triggers:
#   - Manual dispatch (all profiles)
#   - Push to dev touching mobile code → staging build (ad-hoc distribution)
#
# Required GitHub secrets (repo/org level):
#   EXPO_TOKEN       — EAS Personal Access Token (expo.dev → Account → Access Tokens)
#   EXPO_PROJECT_ID  — EAS project UUID from expo.dev project settings
#
# EAS credentials (stored in Expo, NOT in GitHub secrets):
#   Managed via: eas credentials --platform ios
#   - Distribution certificate (Apple Developer Program)
#   - Provisioning profile (App Store for production; Ad Hoc for staging/internal)
#   - App Store Connect API key (Key ID + Issuer ID + p8; set once in EAS)
#
# One-time setup checklist:
#   1. expo login  (or set EXPO_TOKEN)
#   2. eas build:configure   (eas.json already present from Story 85.2)
#   3. eas credentials --platform ios  (register dist cert + provisioning profile)
#   4. Add EXPO_TOKEN and EXPO_PROJECT_ID to GitHub repository secrets
#   5. Fill placeholder values in eas.json submit.production.ios:
#        appleId, ascAppId, appleTeamId

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - simulator
          - staging
          - production
      submit:
        description: 'Submit to App Store after build (production profile only)'
        required: false
        default: false
        type: boolean

  push:
    branches:
      - dev
    paths:
      - 'frontend/apps/mobile/**'
      - '.github/workflows/eas-build-ios.yml'

  # Production builds are triggered manually via workflow_dispatch.
  # The release workflow may also call this workflow after tagging.

jobs:
  build-ios:
    name: EAS iOS Build (${{ github.event.inputs.profile || 'staging' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-mobile-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-mobile-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Typecheck mobile
        working-directory: frontend/apps/mobile
        run: pnpm typecheck

      - name: Lint mobile
        working-directory: frontend
        run: pnpm lint

      # issue #767 (#6) — fail fast before invoking EAS when the required
      # repo/org secrets are absent. Without this the build proceeds to
      # `eas build` and fails deep in the EAS pipeline with an opaque auth
      # error. Note: the real production API_BASE_URL / WS_BASE_URL live in the
      # EAS *project* secret store (not GitHub secrets) — they cannot be
      # verified here, so this only guards the GitHub-level prerequisites.
      - name: Verify required EAS secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$EXPO_TOKEN" ] && missing="$missing EXPO_TOKEN"
          [ -z "$EXPO_PROJECT_ID" ] && missing="$missing EXPO_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing"
            echo "Set them under repo/org Settings → Secrets and variables → Actions."
            echo "See the header of this workflow for the one-time setup checklist."
            exit 1
          fi
          echo "Required EAS secrets present."

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine build profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
          else
            # Push to dev → staging build
            echo "profile=staging" >> $GITHUB_OUTPUT
          fi

      - name: Run EAS build (iOS)
        working-directory: frontend/apps/mobile
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          eas build \
            --platform ios \
            --profile ${{ steps.profile.outputs.profile }} \
            --non-interactive \
            --no-wait

      - name: Surface EAS build URL in job summary (issue #715)
        # --no-wait above returns the moment the build is enqueued; the EAS
        # job then runs minutes later on expo.dev with no feedback in
        # GitHub Actions. Look up the just-enqueued build and write its URL
        # to the step summary so the developer has a direct link instead of
        # navigating expo.dev manually. Non-fatal — never block the build
        # on the summary write.
        if: always()
        working-directory: frontend/apps/mobile
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          set +e
          build_json=$(eas build:list --platform ios --limit 1 --non-interactive --json 2>/dev/null)
          build_url=$(echo "$build_json" | jq -r '.[0].buildProfile as $bp | "\(.[0].id) [\(.[0].status)] profile=\($bp) → https://expo.dev/accounts/_/projects/_/builds/\(.[0].id)"' 2>/dev/null)
          {
            echo "## EAS iOS build (profile=${{ steps.profile.outputs.profile }})"
            if [ -n "$build_url" ] && [ "$build_url" != "null" ]; then
              echo ""
              echo "Latest build: $build_url"
              echo ""
              echo "Raw JSON:"
              echo '```json'
              echo "$build_json" | jq '.[0] | {id, status, platform, buildProfile, createdAt}'
              echo '```'
            else
              echo ""
              echo "Could not read build via \`eas build:list\` — check expo.dev directly."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit to App Store
        # Only submit when: manual dispatch + submit=true + production profile
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.submit == 'true' &&
          steps.profile.outputs.profile == 'production'
        working-directory: frontend/apps/mobile
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --non-interactive \
            --latest
